# Numéro affiché des deux variantes GTK, en un seul endroit.
#
# Contrairement à Android, rien ici n'est comparé par un système de paquets :
# Flatpak met à jour sur l'empreinte du commit, pas sur un numéro. Ce numéro ne
# sert qu'à l'affichage — nom au menu, nom de fenêtre, nom du bundle — mais il
# se recopiait dans quatre fichiers, et il suffisait d'en oublier un pour qu'une
# application se présente sous deux noms différents.
#
# Ne pas modifier à la main : `./livraison.sh` recopie ces valeurs là où il
# faut, et lui seul.
guilde.versionName=0.32
dev.versionName=0.49
