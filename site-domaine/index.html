<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xiom</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  /* L'image seule, en plein ecran et sans bord. "cover" : elle remplit
     tout, quitte a perdre une bande de reflet ou de fond noir sur les cotes
     ou en haut et en bas -- le mot, au centre, reste entier. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  img { display: block; width: 100vw; height: 100vh; height: 100dvh;
        object-fit: cover; object-position: center; }
  /* Sauf sur un ecran en hauteur (telephone) : "cover" n'y montrerait plus
     que "io". L'image y reste entiere, le noir se fond dans le sien. */
  @media (orientation: portrait) {
    img { object-fit: contain; }
  }
</style>
</head>
<body>
<img src="xiom.webp" alt="Xiom" width="1672" height="941">
<!-- Le morceau de la page des applis de la Lune, en boucle, sans lecteur
     visible : la page reste l'image seule. -->
<audio id="musique" src="https://xiom-dev.github.io/zyroom-gtk-android/sielu-cuovggas.mp3"
       loop preload="auto"></audio>
<script>
  // Un navigateur refuse qu'une page joue du son avant le moindre geste du
  // visiteur : play() rend alors une promesse rejetee. Dans ce cas, le
  // premier clic, touche, molette ou toucher lance le morceau -- une fois ;
  // les ecouteurs se retirent ensuite.
  (function () {
    var audio = document.getElementById("musique");
    var GESTES = ["pointerdown", "keydown", "wheel", "touchstart"];
    function auPremierGeste() {
      GESTES.forEach(function (nom) {
        document.removeEventListener(nom, auPremierGeste);
      });
      audio.play().catch(function () {});
    }
    var depart = audio.play();
    if (depart) {
      depart.catch(function () {
        GESTES.forEach(function (nom) {
          document.addEventListener(nom, auPremierGeste, { passive: true });
        });
      });
    }
  })();
</script>
</body>
</html>
