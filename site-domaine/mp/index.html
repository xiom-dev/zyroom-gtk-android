<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MP du hall de guilde</title>
<!-- Apercu des liens (Discord...) : image faite par outils/apercus-xiom.py -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="La Lune Éternelle">
<meta property="og:title" content="MP du hall de guilde">
<meta property="og:description" content="Les MP à forer pour les recettes de La Lune Éternelle, calculées sur le stock du hall de guilde.">
<meta property="og:url" content="https://xiom.be/mp/">
<meta property="og:image" content="https://xiom.be/mp/apercu.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="MP du hall de guilde">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Les MP à forer pour les recettes de La Lune Éternelle, calculées sur le stock du hall de guilde.">
<meta name="theme-color" content="#10171a">
<!-- Meme raison que la page du forage : l'hebergeur ne relaie pas le
     Cache-Control du .htaccess, et une page gardee en cache fait croire
     qu'une correction n'a pas pris. -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<link rel="icon" href="favicon.png" type="image/png">
<style>
  /* Les couleurs de xiom.be et de ZyRoom, reprises de la page du forage. */
  :root {
    color-scheme: dark;
    --fond: #10171a; --surface: #172226; --trait: #24343a;
    --sarcelle: #3f7a68; --clair: #8fbfae; --or: #e8c15a;
    --texte: #e2e8e6; --faible: #9aa8a5;
    --oui: #4bbf72; --non: #55605e; --alerte: #e8a13a; --rupture: #e2604f;
    --stop: #6fa8dc;
    /* La provenance d'une MP, en teintes douces du meme theme (Ludo) : foret
       verte, jungle mauve, desert rouge, lacs bleus, primes blanches. */
    --eco-Forest: #9fd8a8; --eco-Jungle: #c9a8e6; --eco-Desert: #ec9e94;
    --eco-Lake: #93bfec; --eco-PrimeRoots: #f4f4ee;
    /* Les trois poids d'armure. */
    --poids-l: #9ad9d2; --poids-m: #ecd08a; --poids-h: #e0aa86;
  }
  .eco-Forest { color: var(--eco-Forest); } .eco-Jungle { color: var(--eco-Jungle); }
  .eco-Desert { color: var(--eco-Desert); } .eco-Lake { color: var(--eco-Lake); }
  .eco-PrimeRoots { color: var(--eco-PrimeRoots); }
  .poids-l { color: var(--poids-l); } .poids-m { color: var(--poids-m); }
  .poids-h { color: var(--poids-h); }
  * { box-sizing: border-box; }
  /* Un "display: flex" l'emporterait sur l'attribut hidden : la barre des
     filtres restait visible dans les onglets qui la cachent. */
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 0 16px 48px;
    background: var(--fond); color: var(--texte);
    font-family: system-ui, sans-serif; font-size: 15px;
  }
  main, header { max-width: 1880px; margin: 0 auto; }
  header { padding: 16px 0 4px; display: flex; gap: 12px; flex-wrap: wrap;
           align-items: baseline; justify-content: space-between; }
  h1 { font-size: 1.4rem; margin: 0; color: var(--or); }
  p { margin: 0 0 10px; color: var(--faible); line-height: 1.5; }
  a { color: var(--clair); }
  #resume { color: var(--faible); font-size: .9rem; margin: 4px 0 12px; }
  #resume b { color: var(--texte); font-weight: 600; }

  button, input, select {
    background: var(--surface); color: var(--texte);
    border: 1px solid var(--trait); border-radius: 7px; padding: 6px 12px;
    font: inherit;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--sarcelle); }
  button[aria-pressed="true"] {
    background: var(--sarcelle); color: #08120f; border-color: var(--sarcelle);
    font-weight: 600;
  }
  button.principal { background: var(--sarcelle); color: #08120f;
                     border-color: var(--sarcelle); font-weight: 600; }
  button.danger:hover { border-color: var(--rupture); color: var(--rupture); }
  input[type="number"] { width: 5.5em; padding: 4px 6px; }

  .onglets, .filtres { display: flex; gap: 6px; flex-wrap: wrap;
                       margin: 0 0 10px; align-items: center; }
  .onglets button { font-size: 1rem; }
  /* menus deroulants des onglets : la liste s'ouvre sous le titre */
  .menu { position: relative; }
  .menu-liste { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30;
                display: flex; flex-direction: column; gap: 4px; min-width: 240px;
                padding: 6px; background: var(--fond); border: 1px solid var(--trait);
                border-radius: 9px; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }
  .menu-liste[hidden] { display: none; }
  .menu-liste button { display: flex; justify-content: space-between; gap: 18px;
                       align-items: baseline; text-align: left; white-space: nowrap; }
  /* la roue dentee des reglages, devant le pseudo */
  #onglet-reglages { padding: 4px 7px; line-height: 0; vertical-align: middle; margin-right: 5px; }
  /* KipeeCraft tout a droite, le kipee en fond du bouton ; un voile sombre
     (sarcelle quand l'onglet est ouvert) garde le texte lisible. */
  #onglet-kc { margin-left: auto; padding: 6px 60px; color: #fff; font-weight: 600;
               text-shadow: 0 0 3px #000, 0 0 3px #000;
               background: linear-gradient(rgba(16, 23, 26, .15), rgba(16, 23, 26, .15)),
                           url("kc/kipee.png") center 42% / cover; }
  #onglet-kc[aria-pressed="true"] {
    background: linear-gradient(rgba(63, 122, 104, .35), rgba(63, 122, 104, .35)),
                url("kc/kipee.png") center 42% / cover; }
  .filtres input[type="search"] { flex: 0 1 260px; min-width: 160px; }
  /* L'import des recettes a droite, sous l'onglet KipeeCraft */
  #choisir-kc { margin-left: auto; }
  .compte { color: var(--faible); font-size: .85rem; font-weight: 400; }
  /* le hall affiche, choisi dans le menu a cote du titre */
  .titre-gh { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #gh-titre { color: var(--sarcelle); }
  #choix-gh { font: inherit; padding: 4px 8px; }
  [aria-pressed="true"] .compte { color: #08120f; }

  /* Le tableau deborde volontiers en largeur sur un telephone : il defile
     seul de ce cote-la, sans pousser la page. */
  .cadre { overflow-x: auto; }
  /* Tableaux des MP, armures et bijoux : la ligne des en-tetes reste visible pendant le
     defilement. Un cadre qui defile de cote retient l'en-tete chez lui ; sur
     un ecran large, rien ne deborde, il laisse donc l'en-tete coller a la
     fenetre. */
  @media (min-width: 1100px) { .cadre.collant { overflow: visible; } }
  /* MP forees a gauche, MP des boss a droite ; l'une sous l'autre sur un
     ecran etroit. */
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .deux > div { min-width: 0; }
  /* deux tableaux dans une meme colonne (Armes) */
  .deux > div > div + div { margin-top: 28px; }
  .deux h2 { font-size: 1.05rem; color: var(--or); margin: 4px 0 8px; }
  @media (max-width: 1100px) { .deux { grid-template-columns: 1fr; } }
  /* Sur un telephone, le nom de la MP garde de quoi tenir sur trois lignes
     au plus : le reste du tableau defile de cote. */
  td:first-child { min-width: 190px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid var(--trait); padding: 5px 8px;
           text-align: left; vertical-align: top; }
  th { color: var(--clair); font-weight: 600; white-space: nowrap;
       position: sticky; top: 0; background: var(--fond); z-index: 1; }
  /* Les MP regroupees par type : pas de trait entre les lignes, seulement
     une petite separation sous le symbole de chaque type. */
  table.types td { border-bottom: none; padding-top: 3px; padding-bottom: 3px; }
  table.types tr.type td { padding-top: 14px; border-bottom: 1px solid var(--trait);
                           color: var(--clair); font-weight: 600; }
  table.types tbody tr.type:first-child td { padding-top: 6px; }
  /* L'icone du jeu, sans le nom de la source (en haut) ni les etoiles (a
     droite) : il n'en reste que la forme, commune a tout le type. */
  .symbole { display: inline-block; width: 32px; height: 32px; margin-right: 8px;
             vertical-align: middle; border-radius: 4px;
             background-size: 50px 50px; background-position: -5px -14px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums;
               white-space: nowrap; }
  tbody tr:hover { background: #142024; }
  .faible { color: var(--faible); }
  /* "Q130 x2" ne se coupe jamais : la ligne passe a la suivante entre deux
     piles, pas entre la qualite et sa quantite. Le point separateur reste en
     fin de ligne, avec la pile qui le precede. */
  .pile { white-space: nowrap; }
  .inconnue { color: var(--alerte); font-style: italic; }
  /* La sorte a gauche (nom en vert, etoiles dessous), le nom de la MP et
     sa ligne de detail a droite. Largeur fixe : les noms restent alignes. */
  .mp { display: flex; align-items: flex-start; gap: 6px; }
  .etoiles { flex: none; width: 3.6em; line-height: 1.1; white-space: nowrap; }
  .etoiles .sorte { display: block; color: var(--sarcelle); font-size: .85rem;
                    font-weight: 600; }
  .etoiles .astres { display: block; color: var(--or); letter-spacing: -1px;
                     font-size: .8rem; }

  .etat { display: inline-block; border-radius: 10px; padding: 1px 8px;
          font-size: .8rem; font-weight: 600; white-space: nowrap;
          color: #08120f; }
  /* A forer en rouge, bientot en rupture en jaune */
  .etat.rupture { background: var(--or); }
  .etat.forer { background: var(--rupture); }
  .etat.ok { background: var(--oui); }
  .etat.stop { background: var(--stop); }
  .etat.bas { background: var(--non); color: var(--texte); }
  /* Armures et bijoux : la piece la moins nombreuse en jaune, la plus
     nombreuse en bleu, ce qui manque pour egaler celle-ci en blanc, les
     ensembles complets en vert ; une goutte par bonus, comme dans ZyRoom. */
  td.moins { color: var(--or); }
  td.plus { color: var(--stop); }
  div.manque { color: var(--texte); font-weight: 600; }
  th .total { font-weight: 700; color: var(--texte); }
  /* Les titres alignes par le bas : les totaux tombent tous sur la meme
     ligne, meme sous un titre de deux lignes ("Crafts possibles"). */
  table.types thead th { vertical-align: bottom; }
  /* Armures et bijoux : le "(x2)" sous le nom de la piece tombe sur la
     meme ligne pour toutes les colonnes. */
  table.ensembles thead th { vertical-align: bottom; }
  td.complets { color: var(--sarcelle); }
  .goutte { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            margin-left: 3px; vertical-align: middle; }

  /* Une recette s'ouvre sur place : le detail de ses pieces, et ses
     reglages quand on est connecte. */
  tr.recette { cursor: pointer; }
  tr.recette td:first-child::before { content: "▸ "; color: var(--faible); }
  tr.recette.ouverte td:first-child::before { content: "▾ "; }
  tr.detail > td { background: var(--surface); padding: 10px 12px 14px; }
  tr.detail table th { position: static; background: transparent; }
  .edition { display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
             margin: 10px 0 0; color: var(--faible); }
  .edition label { display: flex; gap: 6px; align-items: center; }

  /* Onglet Mobs : un boss par ligne, ses MP en dessous de son etat */
  .qualites { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
  .deux h3 { font-size: .95rem; color: var(--clair); margin: 18px 0 6px; }
  .deux h3:first-of-type { margin-top: 4px; }
  .nom-mob { color: var(--oui); }
  .copier-mobs { font-size: .8rem; padding: 2px 10px; margin-left: 10px; vertical-align: middle; }
  .qmob { color: var(--or); font-size: .85rem; font-weight: 600; margin-left: 6px; }
  /* Toutes les sections ont les memes colonnes : le boss sur 55 %, ses MP
     sur le reste ; dans les MP, le nom puis la quantite, alignes en grille. */
  table.mobs { table-layout: fixed; }
  table.mobs td:first-child { width: 55%; }
  .butin { display: grid; grid-template-columns: 8em auto; white-space: nowrap; }

  section.panneau { background: var(--surface); border: 1px solid var(--trait);
                    border-radius: 10px; padding: 12px 16px; margin: 0 0 14px; }
  section.panneau h2 { font-size: 1.05rem; color: var(--or); margin: 0 0 8px; }
  .grille { display: grid; grid-template-columns: max-content max-content;
            gap: 6px 12px; align-items: center; margin-bottom: 10px; }
  #apercu li { margin: 2px 0; }

  dialog { background: var(--surface); color: var(--texte);
           border: 1px solid var(--sarcelle); border-radius: 10px;
           padding: 16px 18px; max-width: 340px; }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  dialog form { display: flex; flex-direction: column; gap: 8px; }
  dialog .boutons { display: flex; gap: 8px; justify-content: flex-end; }
  #message { min-height: 1.4em; color: var(--alerte); font-size: .9rem; }
  #bandeau { position: fixed; left: 50%; bottom: 16px;
             transform: translateX(-50%); background: var(--sarcelle);
             color: #08120f; padding: 8px 16px; border-radius: 8px;
             font-weight: 600; display: none; z-index: 5; }
  #bandeau.erreur { background: var(--rupture); }
</style>
</head>
<body>
<!-- Retour au sommaire de xiom.be, le meme sur chaque page. -->
<a class="xiom-retour" href="/index/" style="position:fixed;left:12px;bottom:12px;z-index:900;padding:6px 14px;border-radius:999px;background:rgba(16,23,26,.88);border:1px solid #4bbf72;color:#e2e8e6;font:600 13px/1.4 system-ui,sans-serif;text-decoration:none">← Sommaire</a>
<header>
  <!-- Le hall affiche : celui de La Lune, ou un GH personnel dont la cle
       n'existe que dans ce navigateur -->
  <div class="titre-gh">
    <h1>MP du hall de guilde<span id="gh-titre"></span></h1>
    <select id="choix-gh" aria-label="Hall de guilde affiché" hidden></select>
    <button type="button" id="retirer-gh" hidden title="Oublier ce GH : sa clé est effacée de ce navigateur">Retirer ce GH</button>
  </div>
  <div>
    <!-- Reglages : une roue dentee devant le pseudo, aux editeurs seulement -->
    <button type="button" data-onglet="reglages" title="Réglages : objectif, qualité et seuils communs ; import des recettes KipeeCraft" aria-label="Réglages" aria-pressed="false" hidden id="onglet-reglages"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.67 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.12.22.39.3.6.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.04.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.08.48 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg></button>
    <!-- Retour a ZyRoom-web : venue de son onglet Gestion, la page revient
         en arriere (le navigateur peut la rendre sans tout recharger) ;
         ouverte directement, elle y va -->
    <button type="button" id="vers-zyroom" title="Revenir à ZyRoom-web">ZyRoom</button>
    <span id="connecte" class="faible"></span>
    <button id="entrer" type="button">Se connecter pour modifier</button>
    <button id="sortir" type="button" hidden>Se déconnecter</button>
  </div>
</header>
<main>
  <p id="resume">Chargement…</p>

  <!-- Onglets ranges en trois menus deroulants (MP, Stuff, Divers), puis
       Recettes et KipeeCraft -->
  <div class="onglets" role="tablist">
    <div class="menu" data-menu="mp">
      <button type="button" class="menu-titre" aria-expanded="false" aria-pressed="false">MP<span class="choix"></span> ▾</button>
      <div class="menu-liste" hidden>
        <button type="button" data-onglet="forer" title="MP qui manquent pour atteindre l'objectif de crafts de chaque recette" aria-pressed="true">À stocker <span class="compte" id="n-forer"></span></button>
        <button type="button" data-onglet="stop" title="MP dont le stock dépasse le maximum de crafts : le surplus peut sortir du hall" aria-pressed="false">Ne plus stocker <span class="compte" id="n-stop"></span></button>
        <button type="button" data-onglet="op" title="MP d'OP, cristaux de Maraudeur et larves de Kitin, comptées à part" aria-pressed="false">MP d'OP <span class="compte" id="n-op"></span></button>
        <button type="button" data-onglet="nexus" title="MP suprêmes du Nexus, seulement ici : stock voulu de chacune et seuil de rupture dans les réglages ; le compteur dit combien sont à forer" aria-pressed="false">MP Nexus <span class="compte" id="n-nexus"></span></button>
        <button type="button" data-onglet="inutiles" title="MP du hall qui ne font partie d'aucune recette" aria-pressed="false">MP inutilisées <span class="compte" id="n-inutiles"></span></button>
        <button type="button" data-onglet="coffre" title="MP génériques molles et dures, pièces de fabrication des coffres" aria-pressed="false">MP de coffre <span class="compte" id="n-coffre"></span></button>
        <button type="button" data-onglet="toutes" title="Toutes les MP demandées par les recettes, avec leur stock" aria-pressed="false">Toutes les MP <span class="compte" id="n-toutes"></span></button>
      </div>
    </div>
    <div class="menu" data-menu="stuff">
      <button type="button" class="menu-titre" aria-expanded="false" aria-pressed="false">Stuff<span class="choix"></span> ▾</button>
      <div class="menu-liste" hidden>
        <button type="button" data-onglet="tenues" title="Armures du hall, rangées en ensembles complets (même nom, qualité et bonus)" aria-pressed="false">Armures <span class="compte" id="n-tenues"></span></button>
        <button type="button" data-onglet="armes" title="Armes, amplificateurs, boucliers et munitions du hall" aria-pressed="false">Armes <span class="compte" id="n-armes"></span></button>
        <button type="button" data-onglet="bijoux" title="Bijoux du hall, rangés en parures complètes (même nom, qualité et bonus)" aria-pressed="false">Bijoux <span class="compte" id="n-bijoux"></span></button>
        <button type="button" data-onglet="plans" title="Plans d'armure du Maraudeur du hall" aria-pressed="false">Plans d'armure <span class="compte" id="n-plans"></span></button>
        <button type="button" data-onglet="outils" title="Outils de création et pioches de forage du hall" aria-pressed="false">Outils <span class="compte" id="n-outils"></span></button>
      </div>
    </div>
    <div class="menu" data-menu="divers">
      <button type="button" class="menu-titre" aria-expanded="false" aria-pressed="false">Divers<span class="choix"></span> ▾</button>
      <div class="menu-liste" hidden>
        <button type="button" data-onglet="potions" title="Potions du hall" aria-pressed="false">Potions <span class="compte" id="n-potions"></span></button>
        <button type="button" data-onglet="feux" title="Feux d'artifice du hall" aria-pressed="false">Feux d'artifice <span class="compte" id="n-feux"></span></button>
        <button type="button" data-onglet="divers" title="Tout le reste du hall : fleurs, recharges, cristaux, plans…" aria-pressed="false">Autres <span class="compte" id="n-divers"></span></button>
      </div>
    </div>
    <button type="button" data-onglet="mobs" title="Rois et nommés qui lâchent les MP des recettes : à looter, bientôt en rupture, à ne plus looter" aria-pressed="false">Mobs <span class="compte" id="n-mobs"></span></button>
    <button type="button" data-onglet="recettes" title="Les recettes suivies : état, crafts possibles et MP qui bloque" aria-pressed="false" hidden id="onglet-recettes">Recettes <span class="compte" id="n-recettes"></span></button>
    <button type="button" data-onglet="kc" title="KipeeCraft dans le navigateur, pour composer une recette" aria-pressed="false" id="onglet-kc">KipeeCraft</button>
  </div>

  <div class="filtres" id="filtres">
    <input type="search" id="cherche" placeholder="Chercher une MP ou une recette" aria-label="Chercher">
    <button type="button" data-eco="" aria-pressed="true">Tous</button>
    <button type="button" data-eco="PrimeRoots" aria-pressed="false">Primes</button>
    <button type="button" data-eco="Desert" aria-pressed="false">Désert</button>
    <button type="button" data-eco="Forest" aria-pressed="false">Forêts</button>
    <button type="button" data-eco="Jungle" aria-pressed="false">Jungle</button>
    <button type="button" data-eco="Lake" aria-pressed="false">Lacs</button>
    <button type="button" data-eco="none" aria-pressed="false">Communes</button>
    <button type="button" class="principal" id="choisir-kc" hidden title="Fichiers .kc enregistrés depuis KipeeCraft">Importer des recettes KipeeCraft</button>
  </div>

  <div id="vue"></div>
</main>

<dialog id="porte">
  <form method="dialog" id="porte-form">
    <strong>Connexion</strong>
    <input id="porte-nom" autocomplete="username" placeholder="Nom du joueur" required>
    <input id="porte-mdp" type="password" autocomplete="current-password" placeholder="Mot de passe (éditeurs seulement)">
    <div id="message"></div>
    <div class="boutons">
      <button type="button" id="porte-annuler">Annuler</button>
      <button type="submit" class="principal">Entrer</button>
    </div>
  </form>
</dialog>
<dialog id="ajout-gh">
  <form method="dialog" id="ajout-form">
    <strong>Ajouter un GH personnel</strong>
    <p class="faible">Colle la clé API de la guilde (elle commence par « g »), créée sur
      <a href="https://app.ryzom.com/app_ryzomapi" target="_blank" rel="noopener">app.ryzom.com</a>.
      Elle reste dans ce navigateur : la page ne l'envoie qu'à l'API de Ryzom, jamais à xiom.be.
      Personne d'autre ne voit ce GH.</p>
    <input id="ajout-cle" placeholder="Clé API de guilde" autocomplete="off" spellcheck="false" required>
    <div id="ajout-message"></div>

      <button type="submit" class="principal">Ajouter</button>
    </div>
  </form>
</dialog>
<div id="bandeau" role="status"></div>

<script>
"use strict";
// Le stock vient du releve automatique (branche `journaux`, toutes les quinze
// minutes) ; les recettes et les reglages, de mp.php ; les noms des MP, de
// noms.json, fabrique par outils/page-mp.py.
const DEPOT = "https://raw.githubusercontent.com/xiom-dev/zyroom-gtk-android/journaux/";

const ECOS = { PrimeRoots: "Primes", Desert: "Désert", Forest: "Forêts",
               Jungle: "Jungle", Lake: "Lacs", none: "Communes",
               Corrupted: "Corrompues" };
const ETATS = { rupture: "Bientôt en rupture", forer: "À forer", ok: "Suffisant",
                stop: "Ne plus forer" };

let noms = { mp: {}, plans: {} };
let mobs = [];            // rois et nommes, de mobs.json (outils/page-mobs.py)
let qualiteMob = 0;       // onglet Mobs : 0 = toutes les qualites
let etat = null;          // reponse de mp.php
let stock = new Map();    // fiche -> [[qualite, quantite], ...]
// Les MP des recettes de La Lune comparees au stock du GH affiche, pour
// l'onglet Mobs : sur Rod Of Heaven, le stock et le manque de Rod seul.
let mpsMobs = [];
let releve = null;        // date du releve du hall
let equipement = new Map(); // "fiche|qualite|bonus" -> nombre (armures et bijoux)
let usure = new Map();      // "fiche|qualite|bonus" -> [hp, max] de la piece la plus usee
let entamees = new Map();   // "fiche|qualite" -> [[hp, max, nombre]], chaque arme entamee
let calcul = null;
// L'onglet ouvert survit a un rafraichissement de la page (F5) : il est
// garde pour cet onglet du navigateur (sessionStorage), pas au-dela.
let onglet = "forer";
try {
  const garde = sessionStorage.getItem("mp-onglet");
  if (garde && document.querySelector('[data-onglet="' + garde + '"]')) onglet = garde;
} catch (e) {}
let eco = "";
let ouvertes = new Set();
let jeton = "";
try { jeton = localStorage.getItem("mp-jeton") || ""; } catch (e) {}

// **Les GH personnels ne quittent pas le navigateur.** Leur cle est gardee
// ici (localStorage) et ne part que vers l'API de Ryzom, qui accepte les
// appels des pages web : ni xiom.be ni personne d'autre ne voit ce hall.
// Sans les recettes de la guilde (elles restent sur le serveur), un GH
// personnel n'a que les onglets du contenu du hall.
const LUNE = "La Lune Éternelle";
// Les GH que ZyRoom-web sert (comme GUILDES dans zyroom/zr.js, hors La
// Lune) : leur cle reste sur le serveur, le flux vient de zyroom.php avec le
// jeton commun. "zr:" + numero de guilde tient lieu de cle.
const GH_ZYROOM = [{ cle: "zr:105908280", nom: "Rod Of Heaven" }];
let ghPerso = [];   // [{ cle, nom }]
let ghCourant = ""; // "" : La Lune ; sinon la cle du GH personnel affiche
try {
  ghPerso = JSON.parse(localStorage.getItem("mp-gh") || "[]");
  ghCourant = localStorage.getItem("mp-gh-courant") || "";
} catch (e) {}
if (!Array.isArray(ghPerso)) ghPerso = [];
if (!ghConnus().some((g) => g.cle === ghCourant)) ghCourant = "";
// Les onglets qui comparent le hall aux recettes de la guilde.
const ONGLETS_RECETTES = ["forer", "stop", "toutes", "recettes"];

const $ = (s) => document.querySelector(s);
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;",
    ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const nf = new Intl.NumberFormat("fr-FR");
const nombre = (n) => (Number.isFinite(n) ? nf.format(n) : "∞");

function bandeau(texte, erreur) {
  const b = $("#bandeau");
  b.textContent = texte;
  b.className = erreur ? "erreur" : "";
  b.style.display = "block";
  clearTimeout(bandeau.minuteur);
  bandeau.minuteur = setTimeout(() => { b.style.display = "none"; }, 3500);
}

// ------------------------------------------------------------ chargement

async function charger() {
  if (!jeton) { verrouiller(); return; }
  try {
    const [n, e] = await Promise.all([
      // Revalidee a chaque visite : sans cela, le navigateur garde des jours
      // une ancienne table, sans les noms ajoutes depuis.
      fetch("noms.json", { cache: "no-cache" }).then((r) => r.json()),
      lireEtat(),
      // Sans la liste des boss, seul l'onglet Mobs reste vide.
      fetch("mobs.json", { cache: "no-cache" }).then((r) => (r.ok ? r.json() : []))
        .catch(() => []).then((m) => { mobs = m; }),
    ]);
    noms = n;
    etat = e;
    await chargerStock();
  } catch (souci) {
    if (souci.message === "401") { verrouiller(); return; }
    $("#resume").textContent = "Lecture impossible : " + souci.message;
    return;
  }
  afficherConnexion();
  recalculer();
}

// Sans jeton valide, la page ne montre rien : le mot de passe d'abord.
function verrouiller() {
  jeton = "";
  try { localStorage.removeItem("mp-jeton"); } catch (e) {}
  etat = null;
  $("#vue").innerHTML = "";
  $("#resume").textContent = "Page réservée à la guilde : mot de passe requis.";
  afficherConnexion();
  ouvrirPorte();
}

function ouvrirPorte() {
  $("#message").textContent = "";
  if (!$("#porte").open) $("#porte").showModal();
}

async function lireEtat() {
  const r = await fetch("mp.php", { cache: "no-store",
                                    headers: jeton ? { "X-MP": jeton } : {} });
  if (r.status === 401) throw new Error("401");
  if (!r.ok) throw new Error("mp.php " + r.status);
  return r.json();
}

async function chargerStock() {
  if (ghCourant) return chargerGhPerso(ghCourant);
  const g = etat.reglages.guilde;
  const [s, t] = await Promise.all([
    fetch(DEPOT + "guild-" + g + "-etat.json", { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error("stock " + r.status); return r.json(); }),
    fetch(DEPOT + "roster-" + g + ".releve", { cache: "no-store" })
      .then((r) => (r.ok ? r.text() : "")).catch(() => ""),
    // Les armures et bijoux, avec leur bonus : un fichier a part du releve.
    fetch(DEPOT + "guild-" + g + "-tenues.json", { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : {})).catch(() => ({}))
      .then((e) => { equipement = new Map(Object.entries(e)); }),
    // La durabilite de la piece la plus usee de chaque pile.
    fetch(DEPOT + "guild-" + g + "-usure.json", { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : {})).catch(() => ({}))
      .then((e) => { usure = new Map(Object.entries(e)); }),
    // Les armes entamees, toutes, une par une.
    fetch(DEPOT + "guild-" + g + "-entamees.json", { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : {})).catch(() => ({}))
      .then((e) => { entamees = new Map(Object.entries(e)); }),
  ]);
  stock = lireCoffres(s);
  const secondes = parseInt(t, 10);
  releve = secondes > 0 ? new Date(secondes * 1000) : null;
}

// Le releve range le hall coffre par coffre, "fiche|qualite" -> quantite.
// On additionne tous les coffres : une MP compte ou qu'elle soit rangee.
// Le numero du coffre suit, pour KipeeCraft qui dit ou aller la prendre.
function lireCoffres(s) {
  const m = new Map();
  for (const [coffre, contenu] of Object.entries(s)) {
    if (!coffre.startsWith("chest") || typeof contenu !== "object") continue;
    for (const [cle, quantite] of Object.entries(contenu)) {
      const [fiche, q] = cle.split("|");
      if (!m.has(fiche)) m.set(fiche, []);
      m.get(fiche).push([Number(q), Number(quantite), Number(coffre.slice(5))]);
    }
  }
  return m;
}

// ------------------------------------------------------------ GH personnels
//
// Le flux guild.php lu ici, comme le releve le lit (releve-guildes.py et
// ryzom_api.parse_guild) : memes cles, memes regles, pour que tous les
// onglets fonctionnent sans changer.

// Le nom saisi en jeu arrive en UTF-8 relu comme du latin-1 (ryzom_api.repare_accents).
function repareAccents(t) {
  try { return decodeURIComponent(escape(t)); } catch (e) { return t; }
}

// Ceux de ZyRoom-web, puis ceux que ce navigateur garde.
function ghConnus() { return [...GH_ZYROOM, ...ghPerso]; }

async function lireGuilde(cle) {
  const r = cle.startsWith("zr:")
    ? await fetch("/zyroom/zyroom.php?guilde=" + encodeURIComponent(cle.slice(3)),
                  { cache: "no-store", headers: { "X-MP": jeton } })
    : await fetch("https://api.ryzom.com/guild.php?apikey=" + encodeURIComponent(cle),
                  { cache: "no-store" });
  if (!r.ok) throw new Error((cle.startsWith("zr:") ? "zyroom.php " : "API de Ryzom ") + r.status);
  const xml = new DOMParser().parseFromString(await r.text(), "application/xml");
  const erreur = xml.querySelector("error");
  if (erreur) throw new Error("API de Ryzom : " + (erreur.textContent.trim() || erreur.getAttribute("code")));
  const g = xml.querySelector("guild");
  if (!g) throw new Error("flux de guilde illisible");
  return g;
}

const ARMURE_OU_BIJOU = /^ic[a-z][aj]/;
const BONUS_API = [["v", "hpbuff"], ["s", "sapbuff"], ["e", "stabuff"], ["c", "focusbuff"]];

async function chargerGhPerso(cle) {
  const g = await lireGuilde(cle);
  const entree = ghPerso.find((x) => x.cle === cle);
  const nom = repareAccents(g.querySelector(":scope > name")?.textContent || "");
  if (entree && nom && entree.nom !== nom) { entree.nom = nom; enregistrerGh(); majChoixGh(); }
  const texte = (n, sel) => (n.querySelector(sel)?.textContent || "").trim();
  const piles = new Map();   // "fiche|qualite|coffre" -> quantite
  const tenues = new Map(), pire = new Map(), usees = new Map();
  for (const it of g.querySelectorAll(":scope > room > item")) {
    const fiche = texte(it, "sheet");
    if (!fiche) continue;
    let q = parseInt(texte(it, "quality"), 10) || 0;
    if (q === 1) q = 0;
    const n = Math.max(1, parseInt(texte(it, ":scope > stack"), 10) || 0);
    const coffre = Math.floor((parseInt(it.getAttribute("slot"), 10) || 0) / 500) + 1;
    const cle3 = fiche + "|" + q + "|" + coffre;
    piles.set(cle3, (piles.get(cle3) || 0) + n);
    // La durabilite : l'API arrondit le maximum au-dessus, le jeu le
    // tronque (ryzom_api._parse_craft).
    const hp = parseInt(texte(it, "hp"), 10) || 0;
    const annonce = parseInt(it.querySelector("craftparameters > durability")?.getAttribute("value"), 10) || 0;
    const max = !annonce || hp >= annonce ? annonce : annonce - 1;
    if (ARMURE_OU_BIJOU.test(fiche)) {
      const bonus = BONUS_API.filter(([, b]) => parseInt(texte(it, "craftparameters > " + b), 10)).map(([l]) => l).join("");
      const c = fiche + "|" + q + "|" + bonus;
      tenues.set(c, (tenues.get(c) || 0) + n);
      if (max) {
        const avant = pire.get(c);
        if (!avant || hp * avant[1] < avant[0] * max) pire.set(c, [hp, max]);
      }
    } else if (max && hp < max) {
      const c = fiche + "|" + q;
      if (!usees.has(c)) usees.set(c, new Map());
      const parHp = usees.get(c), k = hp + "|" + max;
      parHp.set(k, (parHp.get(k) || 0) + n);
    }
  }
  stock = new Map();
  for (const [c, n] of piles) {
    const [fiche, q, coffre] = c.split("|");
    if (!stock.has(fiche)) stock.set(fiche, []);
    stock.get(fiche).push([Number(q), n, Number(coffre)]);
  }
  equipement = tenues;
  usure = pire;
  entamees = new Map([...usees].map(([c, parHp]) => [c, [...parHp].map(([k, n]) =>
    [...k.split("|").map(Number), n]).sort((a, b) => a[0] - b[0] || a[1] - b[1])]));
  const cree = parseInt(g.getAttribute("created"), 10);
  releve = cree > 0 ? new Date(cree * 1000) : new Date();
}

async function changerGh(cle) {
