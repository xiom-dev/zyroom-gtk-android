<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MP du hall de guilde</title>
<meta name="description" content="Les MP à forer pour les recettes de La Lune Éternelle, calculées sur le stock du hall de guilde.">
<meta name="theme-color" content="#10171a">
<!-- Meme raison que la page du forage : l'hebergeur ne relaie pas le
     Cache-Control du .htaccess, et une page gardee en cache fait croire
     qu'une correction n'a pas pris. -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%233f7a68'/><circle cx='20' cy='12' r='11' fill='%2310171a'/></svg>">
<style>
  /* Les couleurs de xiom.be et de ZyRoom, reprises de la page du forage. */
  :root {
    color-scheme: dark;
    --fond: #10171a; --surface: #172226; --trait: #24343a;
    --sarcelle: #3f7a68; --clair: #8fbfae; --or: #e8c15a;
    --texte: #e2e8e6; --faible: #9aa8a5;
    --oui: #4bbf72; --non: #55605e; --alerte: #e8a13a; --rupture: #e2604f;
    --stop: #6fa8dc;
    /* La provenance d'une MP, en teintes douces du meme theme (Ludo) : foret
       verte, jungle mauve, desert rouge, lacs bleus, primes blanches. */
    --eco-Forest: #9fd8a8; --eco-Jungle: #c9a8e6; --eco-Desert: #ec9e94;
    --eco-Lake: #93bfec; --eco-PrimeRoots: #f4f4ee;
    /* Les trois poids d'armure. */
    --poids-l: #9ad9d2; --poids-m: #ecd08a; --poids-h: #e0aa86;
  }
  .eco-Forest { color: var(--eco-Forest); } .eco-Jungle { color: var(--eco-Jungle); }
  .eco-Desert { color: var(--eco-Desert); } .eco-Lake { color: var(--eco-Lake); }
  .eco-PrimeRoots { color: var(--eco-PrimeRoots); }
  .poids-l { color: var(--poids-l); } .poids-m { color: var(--poids-m); }
  .poids-h { color: var(--poids-h); }
  * { box-sizing: border-box; }
  /* Un "display: flex" l'emporterait sur l'attribut hidden : la barre des
     filtres restait visible dans les onglets qui la cachent. */
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 0 16px 48px;
    background: var(--fond); color: var(--texte);
    font-family: system-ui, sans-serif; font-size: 15px;
  }
  main, header { max-width: 1880px; margin: 0 auto; }
  header { padding: 16px 0 4px; display: flex; gap: 12px; flex-wrap: wrap;
           align-items: baseline; justify-content: space-between; }
  h1 { font-size: 1.4rem; margin: 0; color: var(--or); }
  p { margin: 0 0 10px; color: var(--faible); line-height: 1.5; }
  a { color: var(--clair); }
  #resume { color: var(--faible); font-size: .9rem; margin: 4px 0 12px; }
  #resume b { color: var(--texte); font-weight: 600; }

  button, input, select {
    background: var(--surface); color: var(--texte);
    border: 1px solid var(--trait); border-radius: 7px; padding: 6px 12px;
    font: inherit;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--sarcelle); }
  button[aria-pressed="true"] {
    background: var(--sarcelle); color: #08120f; border-color: var(--sarcelle);
    font-weight: 600;
  }
  button.principal { background: var(--sarcelle); color: #08120f;
                     border-color: var(--sarcelle); font-weight: 600; }
  button.danger:hover { border-color: var(--rupture); color: var(--rupture); }
  input[type="number"] { width: 5.5em; padding: 4px 6px; }

  .onglets, .filtres { display: flex; gap: 6px; flex-wrap: wrap;
                       margin: 0 0 10px; align-items: center; }
  .onglets button { font-size: 1rem; }
  .filtres input[type="search"] { flex: 0 1 260px; min-width: 160px; }
  .compte { color: var(--faible); font-size: .85rem; font-weight: 400; }
  [aria-pressed="true"] .compte { color: #08120f; }

  /* Le tableau deborde volontiers en largeur sur un telephone : il defile
     seul de ce cote-la, sans pousser la page. */
  .cadre { overflow-x: auto; }
  /* Tableaux des MP, armures et bijoux : la ligne des en-tetes reste visible pendant le
     defilement. Un cadre qui defile de cote retient l'en-tete chez lui ; sur
     un ecran large, rien ne deborde, il laisse donc l'en-tete coller a la
     fenetre. */
  @media (min-width: 1100px) { .cadre.collant { overflow: visible; } }
  /* MP forees a gauche, MP des boss a droite ; l'une sous l'autre sur un
     ecran etroit. */
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .deux > div { min-width: 0; }
  .deux h2 { font-size: 1.05rem; color: var(--or); margin: 4px 0 8px; }
  @media (max-width: 1100px) { .deux { grid-template-columns: 1fr; } }
  /* Sur un telephone, le nom de la MP garde de quoi tenir sur trois lignes
     au plus : le reste du tableau defile de cote. */
  td:first-child { min-width: 190px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid var(--trait); padding: 5px 8px;
           text-align: left; vertical-align: top; }
  th { color: var(--clair); font-weight: 600; white-space: nowrap;
       position: sticky; top: 0; background: var(--fond); z-index: 1; }
  /* Les MP regroupees par type : pas de trait entre les lignes, seulement
     une petite separation sous le symbole de chaque type. */
  table.types td { border-bottom: none; padding-top: 3px; padding-bottom: 3px; }
  table.types tr.type td { padding-top: 14px; border-bottom: 1px solid var(--trait);
                           color: var(--clair); font-weight: 600; }
  table.types tbody tr.type:first-child td { padding-top: 6px; }
  /* L'icone du jeu, sans le nom de la source (en haut) ni les etoiles (a
     droite) : il n'en reste que la forme, commune a tout le type. */
  .symbole { display: inline-block; width: 32px; height: 32px; margin-right: 8px;
             vertical-align: middle; border-radius: 4px;
             background-size: 50px 50px; background-position: -5px -14px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums;
               white-space: nowrap; }
  tbody tr:hover { background: #142024; }
  .faible { color: var(--faible); }
  .inconnue { color: var(--alerte); font-style: italic; }
  /* La sorte a gauche (nom en vert, etoiles dessous), le nom de la MP et
     sa ligne de detail a droite. Largeur fixe : les noms restent alignes. */
  .mp { display: flex; align-items: flex-start; gap: 6px; }
  .etoiles { flex: none; width: 3.6em; line-height: 1.1; white-space: nowrap; }
  .etoiles .sorte { display: block; color: var(--sarcelle); font-size: .85rem;
                    font-weight: 600; }
  .etoiles .astres { display: block; color: var(--or); letter-spacing: -1px;
                     font-size: .8rem; }

  .etat { display: inline-block; border-radius: 10px; padding: 1px 8px;
          font-size: .8rem; font-weight: 600; white-space: nowrap;
          color: #08120f; }
  .etat.rupture { background: var(--rupture); }
  .etat.forer { background: var(--or); }
  .etat.ok { background: var(--oui); }
  .etat.stop { background: var(--stop); }
  /* Armures et bijoux : la piece la moins nombreuse en jaune, la plus
     nombreuse en bleu, ce qui manque pour egaler celle-ci en blanc, les
     ensembles complets en vert ; une goutte par bonus, comme dans ZyRoom. */
  td.moins { color: var(--or); }
  td.plus { color: var(--stop); }
  div.manque { color: var(--texte); font-weight: 600; }
  td.complets { color: var(--sarcelle); }
  .goutte { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            margin-left: 3px; vertical-align: middle; }

  /* Une recette s'ouvre sur place : le detail de ses pieces, et ses
     reglages quand on est connecte. */
  tr.recette { cursor: pointer; }
  tr.recette td:first-child::before { content: "▸ "; color: var(--faible); }
  tr.recette.ouverte td:first-child::before { content: "▾ "; }
  tr.detail > td { background: var(--surface); padding: 10px 12px 14px; }
  tr.detail table th { position: static; background: transparent; }
  .edition { display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
             margin: 10px 0 0; color: var(--faible); }
  .edition label { display: flex; gap: 6px; align-items: center; }

  section.panneau { background: var(--surface); border: 1px solid var(--trait);
                    border-radius: 10px; padding: 12px 16px; margin: 0 0 14px; }
  section.panneau h2 { font-size: 1.05rem; color: var(--or); margin: 0 0 8px; }
  .grille { display: grid; grid-template-columns: max-content max-content;
            gap: 6px 12px; align-items: center; margin-bottom: 10px; }
  #apercu li { margin: 2px 0; }

  dialog { background: var(--surface); color: var(--texte);
           border: 1px solid var(--sarcelle); border-radius: 10px;
           padding: 16px 18px; max-width: 340px; }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  dialog form { display: flex; flex-direction: column; gap: 8px; }
  dialog .boutons { display: flex; gap: 8px; justify-content: flex-end; }
  #message { min-height: 1.4em; color: var(--alerte); font-size: .9rem; }
  #bandeau { position: fixed; left: 50%; bottom: 16px;
             transform: translateX(-50%); background: var(--sarcelle);
             color: #08120f; padding: 8px 16px; border-radius: 8px;
             font-weight: 600; display: none; z-index: 5; }
  #bandeau.erreur { background: var(--rupture); }
</style>
</head>
<body>
<header>
  <h1>MP du hall de guilde</h1>
  <div>
    <span id="connecte" class="faible"></span>
    <button id="entrer" type="button">Se connecter pour modifier</button>
    <button id="sortir" type="button" hidden>Se déconnecter</button>
  </div>
</header>
<main>
  <p id="resume">Chargement…</p>

  <div class="onglets" role="tablist">
    <button type="button" data-onglet="forer" aria-pressed="true">À stocker <span class="compte" id="n-forer"></span></button>
    <button type="button" data-onglet="stop" aria-pressed="false">Ne plus stocker <span class="compte" id="n-stop"></span></button>
    <button type="button" data-onglet="inutiles" aria-pressed="false">MP inutilisées <span class="compte" id="n-inutiles"></span></button>
    <button type="button" data-onglet="toutes" aria-pressed="false">Toutes les MP <span class="compte" id="n-toutes"></span></button>
    <button type="button" data-onglet="tenues" aria-pressed="false">Armures <span class="compte" id="n-tenues"></span></button>
    <button type="button" data-onglet="bijoux" aria-pressed="false">Bijoux <span class="compte" id="n-bijoux"></span></button>
    <button type="button" data-onglet="kc" aria-pressed="false">KipeeCraft</button>
    <button type="button" data-onglet="recettes" aria-pressed="false" hidden id="onglet-recettes">Recettes <span class="compte" id="n-recettes"></span></button>
    <button type="button" data-onglet="reglages" aria-pressed="false" hidden id="onglet-reglages">Réglages</button>
  </div>

  <div class="filtres" id="filtres">
    <input type="search" id="cherche" placeholder="Chercher une MP ou une recette" aria-label="Chercher">
    <button type="button" data-eco="" aria-pressed="true">Tous</button>
    <button type="button" data-eco="PrimeRoots" aria-pressed="false">Primes</button>
    <button type="button" data-eco="Desert" aria-pressed="false">Désert</button>
    <button type="button" data-eco="Forest" aria-pressed="false">Forêts</button>
    <button type="button" data-eco="Jungle" aria-pressed="false">Jungle</button>
    <button type="button" data-eco="Lake" aria-pressed="false">Lacs</button>
    <button type="button" data-eco="none" aria-pressed="false">Communes</button>
  </div>

  <div id="vue"></div>
</main>

<dialog id="porte">
  <form method="dialog" id="porte-form">
    <strong>Connexion</strong>
    <input id="porte-nom" autocomplete="username" placeholder="Nom du joueur" required>
    <input id="porte-mdp" type="password" autocomplete="current-password" placeholder="Mot de passe" required autofocus>
    <div id="message"></div>
    <div class="boutons">
      <button type="button" id="porte-annuler">Annuler</button>
      <button type="submit" class="principal">Entrer</button>
    </div>
  </form>
</dialog>
<div id="bandeau" role="status"></div>

<script>
"use strict";
// Le stock vient du releve automatique (branche `journaux`, toutes les quinze
// minutes) ; les recettes et les reglages, de mp.php ; les noms des MP, de
// noms.json, fabrique par outils/page-mp.py.
const DEPOT = "https://raw.githubusercontent.com/xiom-dev/zyroom-gtk-android/journaux/";

const ECOS = { PrimeRoots: "Primes", Desert: "Désert", Forest: "Forêts",
               Jungle: "Jungle", Lake: "Lacs", none: "Communes",
               Corrupted: "Corrompues" };
const ETATS = { rupture: "Bientôt en rupture", forer: "À forer", ok: "Suffisant",
                stop: "Ne plus forer" };

let noms = { mp: {}, plans: {} };
let etat = null;          // reponse de mp.php
let stock = new Map();    // fiche -> [[qualite, quantite], ...]
let releve = null;        // date du releve du hall
let equipement = new Map(); // "fiche|qualite|bonus" -> nombre (armures et bijoux)
let calcul = null;
let onglet = "forer";
let eco = "";
let ouvertes = new Set();
let jeton = "";
try { jeton = localStorage.getItem("mp-jeton") || ""; } catch (e) {}

const $ = (s) => document.querySelector(s);
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;",
    ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const nf = new Intl.NumberFormat("fr-FR");
const nombre = (n) => (Number.isFinite(n) ? nf.format(n) : "∞");

function bandeau(texte, erreur) {
  const b = $("#bandeau");
  b.textContent = texte;
  b.className = erreur ? "erreur" : "";
  b.style.display = "block";
  clearTimeout(bandeau.minuteur);
  bandeau.minuteur = setTimeout(() => { b.style.display = "none"; }, 3500);
}

// ------------------------------------------------------------ chargement

async function charger() {
  if (!jeton) { verrouiller(); return; }
  try {
    const [n, e] = await Promise.all([
      fetch("noms.json").then((r) => r.json()),
      lireEtat(),
    ]);
    noms = n;
    etat = e;
    await chargerStock();
  } catch (souci) {
    if (souci.message === "401") { verrouiller(); return; }
    $("#resume").textContent = "Lecture impossible : " + souci.message;
    return;
  }
  afficherConnexion();
  recalculer();
}

// Sans jeton valide, la page ne montre rien : le mot de passe d'abord.
function verrouiller() {
  jeton = "";
  try { localStorage.removeItem("mp-jeton"); } catch (e) {}
  etat = null;
  $("#vue").innerHTML = "";
  $("#resume").textContent = "Page réservée à la guilde : mot de passe requis.";
  afficherConnexion();
  ouvrirPorte();
}

function ouvrirPorte() {
  $("#message").textContent = "";
  if (!$("#porte").open) $("#porte").showModal();
}

async function lireEtat() {
  const r = await fetch("mp.php", { cache: "no-store",
                                    headers: jeton ? { "X-MP": jeton } : {} });
  if (r.status === 401) throw new Error("401");
  if (!r.ok) throw new Error("mp.php " + r.status);
  return r.json();
}

async function chargerStock() {
  const g = etat.reglages.guilde;
  const [s, t] = await Promise.all([
    fetch(DEPOT + "guild-" + g + "-etat.json", { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error("stock " + r.status); return r.json(); }),
    fetch(DEPOT + "roster-" + g + ".releve", { cache: "no-store" })
      .then((r) => (r.ok ? r.text() : "")).catch(() => ""),
    // Les armures et bijoux, avec leur bonus : un fichier a part du releve.
    fetch(DEPOT + "guild-" + g + "-tenues.json", { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : {})).catch(() => ({}))
      .then((e) => { equipement = new Map(Object.entries(e)); }),
  ]);
  // Le releve range le hall coffre par coffre, "fiche|qualite" -> quantite.
  // On additionne tous les coffres : une MP compte ou qu'elle soit rangee.
  stock = new Map();
  for (const [coffre, contenu] of Object.entries(s)) {
    if (!coffre.startsWith("chest") || typeof contenu !== "object") continue;
    for (const [cle, quantite] of Object.entries(contenu)) {
      const [fiche, q] = cle.split("|");
      if (!stock.has(fiche)) stock.set(fiche, []);
      stock.get(fiche).push([Number(q), Number(quantite)]);
    }
  }
  const secondes = parseInt(t, 10);
  releve = secondes > 0 ? new Date(secondes * 1000) : null;
}

// ------------------------------------------------------------ calcul
//
// Une pile compte pour une recette si sa qualite atteint le minimum de la
// recette pour cette MP : la qualite de craft (210 par defaut), relevee MP
// par MP quand une recette l'exige (la Sha en 250 de la parure).

function fiches(mp) { return (noms.mp[mp] || {}).fiches || []; }

function utile(mp, qmin) {
  let total = 0;
  for (const f of fiches(mp)) {
    for (const [q, n] of stock.get(f) || []) if (q >= qmin) total += n;
  }
  return total;
}

function besoinsDe(recette, reglages) {
  // Une meme MP dans deux emplacements : les quantites s'additionnent.
  const qc = recette.qualite ?? reglages.qualite;
  const parMp = new Map();
  for (const p of recette.pieces) {
    const min = Math.max(qc, (recette.minimums || {})[p.mp] || 0);
    const b = parMp.get(p.mp) || { mp: p.mp, n: 0, min };
    b.n += p.n;
    parMp.set(p.mp, b);
  }
  return [...parMp.values()];
}

// **"Bientot en rupture", c'est quand il en reste un peu.** A zero, la
// rupture est deja la : la MP est simplement a forer, comme le reste. Seuls
// les 1 a 2 crafts (sous le seuil de rupture) previennent qu'on y arrive.
function presqueVide(crafts, reglages) {
  return crafts > 0 && crafts < reglages.rupture;
}

function calculer() {
  const reg = etat.reglages;
  const recettes = [];
  const demandes = new Map();   // mp -> [{min, besoin, parCraft, recette}]
  for (const r of etat.recettes) {
    const objectif = r.objectif ?? reg.objectif;
    const besoins = besoinsDe(r, reg);
    let possibles = Infinity, bloque = null;
    for (const b of besoins) {
      b.utile = utile(b.mp, b.min);
      b.crafts = Math.floor(b.utile / b.n);
      if (b.crafts < possibles) { possibles = b.crafts; bloque = b.mp; }
      if (!demandes.has(b.mp)) demandes.set(b.mp, []);
      demandes.get(b.mp).push({ min: b.min, besoin: objectif * b.n,
                                parCraft: b.n, recette: r });
    }
    const statut = presqueVide(possibles, reg) ? "rupture"
                 : possibles < objectif ? "forer" : "ok";
    recettes.push({ r, objectif, besoins, possibles, bloque, statut });
  }

  const mps = [];
  for (const [mp, liste] of demandes) {
    // **Le manque, qualite par qualite.** Une pile en 250 sert aussi bien
    // une recette en 210, l'inverse non. Pour chaque seuil, ce que demandent
    // les recettes au moins aussi exigeantes doit tenir dans les piles au
    // moins aussi hautes : le pire ecart est ce qu'il faut forer.
    const seuils = [...new Set(liste.map((d) => d.min))].sort((a, b) => a - b);
    let manque = 0;
    for (const t of seuils) {
      const voulu = liste.filter((d) => d.min >= t)
                         .reduce((s, d) => s + d.besoin, 0);
      manque = Math.max(manque, voulu - utile(mp, t));
    }
    const qmin = seuils[0];
    const s = utile(mp, qmin);
    const besoin = liste.reduce((t, d) => t + d.besoin, 0);
    const parCraft = liste.reduce((t, d) => t + d.parCraft, 0);
    const couverture = parCraft ? Math.floor(s / parCraft) : Infinity;
    const statut = presqueVide(couverture, reg) ? "rupture"
                 : manque > 0 || couverture === 0 ? "forer"
                 : besoin > 0 && s > reg.stop * besoin ? "stop" : "ok";
    mps.push({ mp, nom: (noms.mp[mp] || {}).nom, eco: mp.split("_")[1],
               qmin, stock: s, besoin, manque,
               couverture, statut, nbRecettes: liste.length,
               recettes: liste.map((d) => d.recette.nom) });
  }
  return { recettes, mps };
}

// ------------------------------------------------------------ affichage

// La sorte de la MP en etoiles, comme dans le jeu : deux pour une MP de
// choix, trois pour une excellente, quatre pour une supreme.
const ETOILES = { Basic: "", Fine: "★", Choice: "★★", Excellent: "★★★", Supreme: "★★★★" };

// "dessous" : la ligne de detail (ecosysteme, qualite, recettes), en HTML.
function nomMp(mp, dessous) {
  const n = (noms.mp[mp] || {}).nom;
  return etiquette(mp.split("_")[0], n ? enCouleur(mp.split("_")[1], esc(n))
    : '<span class="inconnue" title="Aucune fiche du jeu ne porte ce nom">' + esc(mp) + "</span>",
    dessous);
}
// Le nom dans la couleur de sa provenance.
function enCouleur(eco, html) {
  return '<span class="eco-' + esc(eco) + '">' + html + "</span>";
}
// Dans un type, les MP par provenance (dans l'ordre des filtres), puis par nom.
const ORDRE_ECOS = ["PrimeRoots", "Desert", "Forest", "Jungle", "Lake", "none"];
function parProvenance(a, b) {
  return ORDRE_ECOS.indexOf(a.eco) - ORDRE_ECOS.indexOf(b.eco)
    || (a.nom || a.mp).localeCompare(b.nom || b.mp);
}
// La sorte (nom court et etoiles) a gauche, le nom et sa ligne de detail a
// droite. `nomHtml` est deja echappe.
function etiquette(sorte, nomHtml, dessous) {
  const etoiles = '<span class="etoiles" title="' + esc(SORTES[sorte] || sorte) + '">'
    + '<span class="sorte">' + esc(COURTS[sorte] || "") + "</span>"
    + '<span class="astres">' + (ETOILES[sorte] || "") + "</span></span>";
  return '<div class="mp">' + etoiles + "<div>" + nomHtml
    + (dessous ? '<div class="faible">' + dessous + "</div>" : "") + "</div></div>";
}
// Le nom court de la sorte, celui qu'on emploie entre joueurs.
const COURTS = { Basic: "Base", Fine: "Fine", Choice: "Choix", Excellent: "XL", Supreme: "Sup" };
const SORTES = { Basic: "De base", Fine: "Fine", Choice: "De choix", Excellent: "Excellente",
                 Supreme: "Suprême" };

function retenue(texte) {
  const q = $("#cherche").value.trim().toLowerCase();
  return !q || texte.toLowerCase().includes(q);
}

// Pour une MP de boss, on la loote au lieu de la forer.
function badge(statut, boss) {
  const texte = boss ? ETATS[statut].replace("forer", "looter") : ETATS[statut];
  return '<span class="etat ' + statut + '">' + texte + "</span>";
}

function recalculer() {
  // Un joueur recoit les resultats tout faits : les recettes ne quittent
  // pas le serveur (mp.php).
  calcul = etat.resultats ? { recettes: [], mps: etat.resultats } : calculer();
  const reg = etat.reglages;
  const forer = calcul.mps.filter((m) => m.statut === "rupture" || m.statut === "forer");
  const stop = calcul.mps.filter((m) => m.statut === "stop");
  $("#n-forer").textContent = forer.length;
  $("#n-stop").textContent = stop.length;
  $("#n-toutes").textContent = calcul.mps.length;
  $("#n-inutiles").textContent = inutilisees().length;
  $("#n-tenues").textContent = ensembles(false).length;
  $("#n-bijoux").textContent = ensembles(true).length;
  $("#n-recettes").textContent = calcul.recettes.length;
  const aForer = forer.reduce((t, m) => t + m.manque, 0);
  let quand = "date du relevé inconnue";
  if (releve) {
    const min = Math.round((Date.now() - releve) / 60000);
    quand = "relevé du hall " + (min < 60 ? "il y a " + min + " min"
      : "du " + releve.toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" }));
  }
  $("#resume").innerHTML =
    "La Lune Éternelle · " + esc(quand) + " · objectif <b>" + reg.objectif
    + " crafts</b> par recette, <b>" + reg.rupture + " crafts</b> minimum, <b>" + reg.stop
    + " crafts</b> maximum · <b>"
    + nombre(aForer) + "</b> MP à forer en tout";
  afficher();
}

function afficher() {
  document.querySelectorAll("[data-onglet]").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.onglet === onglet)));
  $("#filtres").hidden = onglet === "reglages" || onglet === "kc";
  // Les ecosystemes ne disent rien d'une armure ni d'un bijou.
  document.querySelectorAll("[data-eco]").forEach((b) =>
    { b.hidden = onglet === "tenues" || onglet === "bijoux"; });
  const vue = $("#vue");
  if (onglet === "kc") vueKc(vue);
  else if (onglet === "recettes") vue.innerHTML = vueRecettes();
  else if (onglet === "reglages") { vue.innerHTML = vueReglages(); brancherReglages(); }
  else if (onglet === "inutiles") vue.innerHTML = vueInutiles();
  else if (onglet === "tenues" || onglet === "bijoux") vue.innerHTML = vueEnsembles(onglet === "bijoux");
  else vue.innerHTML = vueMps(onglet);
}

// ------------------------------------------------------- KipeeCraft
//
// Le simulateur vit dans kc/ : son script et Python (Pyodide) ne se chargent
// qu'a la premiere ouverture de l'onglet. La date dans l'adresse fait
// relire le script a chaque visite : il change plus souvent que le cache
// du navigateur ne le croit.

let kcCharge = null;
function vueKc(vue) {
  vue.innerHTML = "";
  kcCharge = kcCharge || new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = "kc/kc.js?v=" + Date.now();
    s.onload = ok;
    s.onerror = () => { kcCharge = null; ko(new Error("kc/kc.js introuvable")); };
    document.head.appendChild(s);
  });
  kcCharge.then(() => { if (onglet === "kc") { vue.innerHTML = ""; window.KC.afficher(vue); } })
    .catch((souci) => { vue.innerHTML = '<p class="inconnue">' + esc(souci.message) + "</p>"; });
}

// ------------------------------------------------------- MP inutilisees
//
// Ce que le hall garde sans qu'aucune recette le demande : a voir avec
// Nizyros, comme les MP en trop. Lu fiche par fiche, avec les noms du jeu :
// KipeeCraft ne connait pas toutes ces matieres.

const LETTRES_ECO = { c: "none", d: "Desert", f: "Forest", j: "Jungle", l: "Lake",
                      p: "PrimeRoots" };
// L'echelle des sortes est decalee d'une lettre entre forage et betes.
const SORTES_FORAGE = { b: "Basic", c: "Fine", d: "Choice", e: "Excellent", f: "Supreme" };
const SORTES_BETES = { a: "Basic", b: "Fine", c: "Choice", d: "Excellent", e: "Supreme" };

function inutilisees() {
  const utilisees = new Set(calcul.mps.flatMap((m) => fiches(m.mp)));
  const liste = [];
  for (const [fiche, piles] of stock) {
    const info = (noms.fiches || {})[fiche];
    if (!info || utilisees.has(fiche)) continue;
    const foree = fiche.slice(5, 8) === "dxa";
    const parQualite = new Map();
    for (const [q, n] of piles) parQualite.set(q, (parQualite.get(q) || 0) + n);
    liste.push({
      fiche, nom: info[0], anglais: info[1], boss: !foree,
      sorte: (foree ? SORTES_FORAGE : SORTES_BETES)[fiche[9]] || "",
      eco: LETTRES_ECO[fiche[8]] || "", type: typeDuNom(info[0]),
      stock: [...parQualite.values()].reduce((t, n) => t + n, 0),
      piles: [...parQualite].sort((a, b) => b[0] - a[0]),
    });
  }
  return liste;
}

// Le type d'une MP d'apres son nom du jeu, sans la sorte : "Dent suprême /
// Bolobi" -> "Dent", "Fragment suprême de carapace Intelligente / Désert" ->
// "Fragment de carapace".
function typeDuNom(nom) {
  const mots = nom.split(" / ")[0]
    .replace(/\s+(de base|fines?|fins?|de choix|excellente?s?|suprêmes?)(?=\s|$)/gi, "")
    .split(/\s+/);
  if (mots.length > 1 && /^(Fragment|Mesure|Fagot|Boucles?)$/i.test(mots[0])) {
    const n = mots[1].startsWith("d'") ? 2 : mots[2] === "grosse" ? 4 : 3;
    return mots.slice(0, n).join(" ");
  }
  return mots[0];
}

function vueInutiles() {
  const liste = inutilisees().filter((m) =>
    (!eco || m.eco === eco) && retenue(m.nom + " " + m.anglais));
  return '<div class="deux">' + tableInutiles(liste.filter((m) => !m.boss), false)
    + tableInutiles(liste.filter((m) => m.boss), true) + "</div>";
}

function tableInutiles(liste, boss) {
  const titre = "<h2>" + (boss ? "MP lootées sur les boss" : "MP forées") + "</h2>";
  if (!liste.length) return "<div>" + titre + "<p>Aucune MP inutilisée.</p></div>";
  const groupes = new Map();
  for (const m of liste) {
    if (!groupes.has(m.type)) groupes.set(m.type, []);
    groupes.get(m.type).push(m);
  }
  const lignes = [...groupes.keys()].sort((a, b) => a.localeCompare(b)).map((t) => {
    const membres = groupes.get(t).sort(parProvenance);
    const symbole = '<span class="symbole" style="background-image:url(\''
      + "https://api.ryzom.com/item_icon.php?sheetid=" + encodeURIComponent(membres[0].fiche)
      + '&c=1\')"></span>';
    return '<tr class="type"><td colspan="3">' + symbole + esc(t) + "</td></tr>"
      + membres.map((m) => "<tr><td>" + etiquette(m.sorte, enCouleur(m.eco, esc(m.nom)), ECOS[m.eco] || "")
        + '</td><td class="n"><b>' + nombre(m.stock) + "</b></td>"
        + '<td class="faible">' + m.piles.map(([q, n]) => "Q" + q + " ×" + nombre(n)).join(" · ")
        + "</td></tr>").join("");
  }).join("");
  return "<div>" + titre + '<div class="cadre collant"><table class="types"><thead><tr><th>MP</th>'
    + '<th class="n">Stock</th><th>Qualités</th></tr></thead><tbody>' + lignes
    + "</tbody></table></div></div>";
}

// ------------------------------------------------------- Tenues et bijoux
//
// Les armures et bijoux du hall, ranges en ensembles complets (demande de
// Nizyros) : meme nom, meme qualite -- et, pour un bijou, meme bonus. Une
// fiche dit tout : "ic", le peuple, "a" + poids + piece pour une armure,
// "j" + piece pour un bijou, puis la variante ("_2", "_3", "_b").

// [lettre, en-tete, nombre voulu, singulier, pluriel]
const PIECES_ARMURE = [["h", "Casque", 1, "casque", "casques"],
                       ["v", "Gilet", 1, "gilet", "gilets"],
                       ["p", "Pantalon", 1, "pantalon", "pantalons"],
                       ["s", "Manches", 1, "manches", "manches"],
                       ["g", "Gants", 1, "gants", "gants"],
                       ["b", "Bottes", 1, "bottes", "bottes"]];
// Une armure legere n'a pas de casque.
const POIDS = { l: "Légère", m: "Moyenne", h: "Lourde" };
// Les pieces d'une parure, et combien il en faut de chacune.
const PIECES_BIJOU = [["d", "Diadème", 1, "diadème", "diadèmes"],
                      ["e", "Boucles<br>d'oreilles", 2, "boucle d'oreille", "boucles d'oreilles"],
                      ["p", "Pendentif", 1, "pendentif", "pendentifs"],
                      ["r", "Bagues", 2, "bague", "bagues"],
                      ["b", "Bracelets", 2, "bracelet", "bracelets"],
                      ["a", "Anneaux<br>de cheville", 2, "anneau de cheville", "anneaux de cheville"]];
// Les quatre jauges, avec les couleurs des gouttes de ZyRoom.
const BONUS = [["v", "Vie", "#e2696a"], ["s", "Sève", "#4caf50"],
               ["e", "Endurance", "#a97fd0"], ["c", "Concentration", "#4a90d9"]];

function ensembles(bijoux) {
  const groupes = new Map();
  for (const [cle, n] of equipement) {
    const [fiche, q, bonus] = cle.split("|");
    const m = fiche.match(bijoux ? /^(ic[a-z]j)([a-z])(.*)$/ : /^(ic[a-z]a([lmh]))([a-z])(.*)$/);
    if (!m) continue;
    const piece = bijoux ? m[2] : m[3];
    const base = bijoux ? m[1] + "?" + m[3] : m[1] + "?" + m[4];
    // Armures comme bijoux se trient aussi par bonus : une piece en vie ne
    // complete pas une armure en seve.
    const id = base + "|" + q + "|" + bonus;
    if (!groupes.has(id)) {
      groupes.set(id, { id, base, q: Number(q), bonus,
                        poids: bijoux ? "" : m[2], pieces: {}, fiches: [] });
    }
    const g = groupes.get(id);
    g.pieces[piece] = (g.pieces[piece] || 0) + n;
    g.fiches.push(fiche);
  }
  return [...groupes.values()].map((g) => {
    const besoin = (bijoux ? PIECES_BIJOU
      : PIECES_ARMURE.filter(([p]) => p !== "h" || g.poids !== "l")).map(([p, , n]) => [p, n]);
    // Les ensembles complets, et ce qu'il manque a chaque piece pour egaler
    // la plus nombreuse -- le "compte juste" (Ludo). Les pieces vont par
    // paires dans une parure : on compte en ensembles, non en pieces.
    const ensemblesDe = besoin.map(([p, n]) => (g.pieces[p] || 0) / n);
    const complets = Math.min(...ensemblesDe.map(Math.floor));
    const visee = Math.ceil(Math.max(...ensemblesDe));
    g.besoin = besoin;
    g.complets = complets;
    g.moins = Math.min(...ensemblesDe);
    g.plus = Math.max(...ensemblesDe);
    g.manque = besoin.map(([p, n]) => [p, visee * n - (g.pieces[p] || 0)]).filter(([, x]) => x > 0);
    g.nom = nomEnsemble(g, bijoux);
    return g;
  });
}

// "Gilet Kostom" -> "Kostom" ; "Bague fyros de qualité Haute" -> "Fyros de
// qualité Haute". Le nom d'une piece, sans le mot de la piece.
function nomEnsemble(g, bijoux) {
  const n = (noms.equipements || {})[g.fiches[0]] || g.base;
  let reste = bijoux
    ? n.replace(/^(Diadème|Boucle d'oreille|Pendentif|Bague|Bracelet|Anneau de cheville)\s+/i, "")
    : n.replace(/^\S+\s+/, "").replace(/^(lourde?s?|légères?|légers?|moyennes?)\s*\/\s*/i, "");
  reste = reste.charAt(0).toUpperCase() + reste.slice(1);
  return bijoux ? reste : POIDS[g.poids] + " · " + reste;
}

function gouttes(bonus) {
  return BONUS.filter(([l]) => bonus.includes(l)).map(([, nom, couleur]) =>
    '<span class="goutte" title="' + nom + '" style="background:' + couleur + '"></span>').join("");
}

function vueEnsembles(bijoux) {
  const pieces = bijoux ? PIECES_BIJOU : PIECES_ARMURE;
  const motDe = Object.fromEntries(pieces.map(([p, , , un, plusieurs]) => [p, [un, plusieurs]]));
  const liste = ensembles(bijoux).filter((g) => retenue(g.nom + " " + g.base))
    // Legeres, moyennes puis lourdes ; dans chaque poids, des plus basses
    // qualites aux plus hautes (Ludo).
    .sort((a, b) => "lmh".indexOf(a.poids) - "lmh".indexOf(b.poids) || a.q - b.q
                    || a.nom.localeCompare(b.nom) || a.bonus.localeCompare(b.bonus));
  if (!equipement.size) return "<p>Le relevé du hall ne publie pas encore les armures et les bijoux.</p>";
  if (!liste.length) return "<p>Aucun ensemble.</p>";
  const resume = (paires) => paires.map(([p, x]) => x + " " + motDe[p][x > 1 ? 1 : 0]).join(", ");
  const lignes = liste.map((g) => "<tr><td>"
      + (bijoux ? esc(g.nom) : '<span class="poids-' + g.poids + '">' + esc(g.nom) + "</span>")
      + '<div class="faible">Q' + g.q + " " + gouttes(g.bonus) + "</div></td>"
      + '<td class="n complets"><b>' + g.complets + "</b></td>"
      + pieces.map(([p]) => {
        const voulu = g.besoin.find(([b]) => b === p);
        if (!voulu) return '<td class="n faible">·</td>';
        const n = g.pieces[p] || 0;
        const e = n / voulu[1];
        // Toutes les pieces au meme compte : l'ensemble est juste, tout en bleu.
        const classe = e === g.plus ? " plus" : e === g.moins ? " moins" : "";
        return '<td class="n' + classe + '">' + n + "</td>";
      }).join("")
      + "<td>" + (g.manque.length ? '<div class="manque">Manque : ' + esc(resume(g.manque)) + "</div>" : "")
      + "</td></tr>").join("");
  return '<div class="cadre collant"><table><thead><tr><th>' + (bijoux ? "Parure" : "Armure") + "</th>"
    + '<th class="n" title="Ensembles complets">Complets</th>'
    + pieces.map(([, nom, n]) => '<th class="n">' + nom + (n > 1 ? " (×" + n + ")" : "") + "</th>").join("")
    + "<th></th></tr></thead><tbody>" + lignes + "</tbody></table></div>";
}

// Ce qui depasse le seuil "ne plus forer" (50 fois le besoin) : ce qu'on
// peut supprimer ou ecouler sans jamais redescendre sous ce seuil.
function enTrop(m) {
  return Math.max(0, m.stock - etat.reglages.stop * m.besoin);
}

function vueMps(quoi) {
  const ORDRE = { rupture: 0, forer: 1, ok: 2, stop: 3 };
  let liste = calcul.mps.filter((m) =>
    (!eco || m.eco === eco) && retenue((m.nom || m.mp) + " " + m.mp.replace(/_/g, " ") + " " + (m.recettes || []).join(" ")));
  if (quoi === "forer") {
    liste = liste.filter((m) => m.statut === "rupture" || m.statut === "forer");
    // Les MP a forer d'abord, les "bientot en rupture" ensuite (choix de
    // Ludo) ; dans chaque groupe, les plus gros manques en tete.
    const GROUPE = { forer: 0, rupture: 1 };
    liste.sort((a, b) => GROUPE[a.statut] - GROUPE[b.statut] || b.manque - a.manque);
  } else if (quoi === "stop") {
    liste = liste.filter((m) => m.statut === "stop");
    liste.sort((a, b) => b.couverture - a.couverture);
  } else {
    liste.sort((a, b) => ORDRE[a.statut] - ORDRE[b.statut]
                         || (a.nom || a.mp).localeCompare(b.nom || b.mp));
  }
  // Deux tableaux cote a cote : les MP forees a gauche, celles des boss a
  // droite (toutes les MP d'animaux du hall se lootent sur des boss).
  return '<div class="deux">'
    + tableMps(liste.filter((m) => !deBoss(m.mp)), quoi, false)
    + tableMps(liste.filter((m) => deBoss(m.mp)), quoi, true) + "</div>";
}

// Une MP de forage porte la famille "dxa" dans sa fiche du jeu ; toutes les
// autres viennent d'animaux.
function deBoss(mp) {
  const fiche = ((noms.mp[mp] || {}).fiches || [])[0];
  return !!fiche && fiche.slice(5, 8) !== "dxa";
}

// Le nom francais du type de MP, d'apres le dernier mot du nom KipeeCraft.
const TYPES = {
  Amber: "Ambre", Bark: "Écorce", Beak: "Bec", Bone: "Os", Bud: "Bourgeon",
  Claw: "Griffe", Eye: "Œil", Fang: "Croc", Fiber: "Fibre", Horn: "Corne",
  Leather: "Cuir", Ligament: "Ligament", Mandible: "Mandibule", Moss: "Mousse",
  Mushroom: "Champignon", Nail: "Ongle", Oil: "Huile", Pelvis: "Bassin",
  Resin: "Résine", Sap: "Sève", Secretion: "Sécrétion", Seed: "Graine",
  Shell: "Carapace", Skin: "Peau", Spine: "Épine", Sting: "Dard", Tail: "Queue",
  Tooth: "Dent", Trunk: "Trompe", Wing: "Aile", Wood: "Bois", WoodNode: "Nœud de bois",
};
function typeFr(t) { return TYPES[t] || t; }

function tableMps(liste, quoi, boss) {
  const verbe = boss ? "looter" : "forer";
  const titre = "<h2>" + (boss ? "MP lootées sur les boss" : "MP forées") + "</h2>";
  if (!liste.length) {
    return "<div>" + titre + "<p>" + (quoi === "forer" ? "Rien à " + verbe
              + " : toutes les recettes ont leur objectif."
            : quoi === "stop" ? "Aucune MP en trop." : "Aucune MP.") + "</p></div>";
  }
  // Quatre colonnes, et une cinquieme pour ce qu'il faut forer. "Crafts
  // possibles" compte toutes les recettes ensemble : avec 15 MP, un casque
  // a 5 et un pantalon a 3 ne font qu'un tour complet (8 MP), pas trois.
  const forer = quoi === "forer";
  const trop = quoi === "stop";
  const colonnes = 4 + (forer || trop ? 1 : 0);
  // Regroupees par type (graines, cuirs...), types dans l'ordre alphabetique,
  // et dans chaque type l'ordre de l'onglet.
  const groupes = new Map();
  liste.forEach((m) => {
    const t = m.mp.split("_")[3];
    if (!groupes.has(t)) groupes.set(t, []);
    groupes.get(t).push(m);
  });
  const ordre = [...groupes.keys()].sort((a, b) => typeFr(a).localeCompare(typeFr(b)));
  const lignes = ordre.map((t) => {
    const fiche = ((noms.mp[groupes.get(t)[0].mp] || {}).fiches || [])[0];
    const symbole = fiche ? '<span class="symbole" style="background-image:url(\''
      + "https://api.ryzom.com/item_icon.php?sheetid=" + encodeURIComponent(fiche)
      + '&c=1\')"></span>' : "";
    return '<tr class="type"><td colspan="' + colonnes + '">' + symbole + esc(typeFr(t))
      + "</td></tr>" + (quoi === "toutes" ? groupes.get(t) : groupes.get(t).sort(parProvenance))
        .map(ligneMp).join("");
  }).join("");
  function ligneMp(m) {
    return "<tr><td>" + nomMp(m.mp, ECOS[m.eco]
      + " · Q" + m.qmin + "+ · " + m.nbRecettes + " recette"
      + (m.nbRecettes > 1 ? "s" : "")) + "</td>"
      + "<td>" + badge(m.statut, boss) + "</td>"
      + '<td class="n">' + nombre(m.stock) + "</td>"
      + '<td class="n"><b>' + nombre(m.couverture) + "</b></td>"
      + (forer ? '<td class="n">' + (m.manque > 0 ? nombre(m.manque) : "—") + "</td>" : "")
      + (trop ? '<td class="n"><b>' + nombre(enTrop(m)) + "</b></td>" : "")
      + "</tr>";
  }
  return "<div>" + titre + '<div class="cadre collant"><table class="types"><thead><tr><th>MP</th><th>État</th>'
    + '<th class="n" title="Ce que le hall contient, à la qualité demandée ou plus">Stock</th>'
    + '<th class="n" title="Crafts de toutes les recettes qui utilisent cette MP, faits ensemble">Crafts<br>possibles</th>'
    + (forer ? '<th class="n" title="MP à ' + verbe + ' pour atteindre ' + etat.reglages.objectif
               + ' crafts de chaque recette">À ' + verbe + "</th>" : "")
    + (trop ? '<th class="n" title="Au-delà de ' + etat.reglages.stop
               + ' fois le besoin : à supprimer ou à écouler, à voir avec Nizyros">MP en trop</th>' : "")
    + "</tr></thead><tbody>" + lignes + "</tbody></table></div></div>";
}

function vueRecettes() {
  const ORDRE = { rupture: 0, forer: 1, ok: 2 };
  const liste = calcul.recettes.filter((x) =>
    (!eco || x.besoins.some((b) => b.mp.split("_")[1] === eco))
    && retenue(x.r.nom + " " + x.besoins.map((b) => ((noms.mp[b.mp] || {}).nom || "")
                                    + " " + b.mp.replace(/_/g, " ")).join(" ")))
    .sort((a, b) => ORDRE[a.statut] - ORDRE[b.statut] || a.possibles - b.possibles
                    || a.r.nom.localeCompare(b.r.nom));
  const lignes = liste.map((x) => {
    const ouverte = ouvertes.has(x.r.id);
    let html = '<tr class="recette' + (ouverte ? " ouverte" : "") + '" data-id="'
      + esc(x.r.id) + '"><td>' + esc(x.r.nom) + '<div class="faible">'
      + esc(noms.plans[x.r.plan] || "Plan " + x.r.plan) + "</div></td>"
      + "<td>" + badge(x.statut) + "</td>"
      + '<td class="n"><b>' + nombre(x.possibles) + "</b> / " + x.objectif + "</td>"
      + "<td>" + (x.statut === "ok" ? "" : nomMp(x.bloque)) + "</td></tr>";
    if (ouverte) html += '<tr class="detail"><td colspan="4">' + detail(x) + "</td></tr>";
    return html;
  }).join("");
  return '<div class="cadre"><table><thead><tr><th>Recette</th><th>État</th>'
    + '<th class="n">Crafts possibles</th><th>MP qui bloque</th></tr></thead><tbody>'
    + lignes + "</tbody></table></div>";
}

function detail(x) {
  const connecte = Boolean(etat.editeur);
  const reg = etat.reglages;
  const qc = x.r.qualite ?? reg.qualite;
  const lignes = x.besoins.map((b) => {
    const propre = (x.r.minimums || {})[b.mp];
    const q = connecte
      ? '<input type="number" min="1" max="300" data-min="' + esc(b.mp) + '" value="'
        + (propre || "") + '" placeholder="' + qc + '">'
      : "Q" + b.min + (propre ? " *" : "");
    return "<tr><td>" + nomMp(b.mp) + '</td><td class="n">' + b.n + "</td><td>" + q
      + '</td><td class="n">' + nombre(b.utile) + '</td><td class="n">'
      + nombre(b.crafts) + "</td></tr>";
  }).join("");
  let html = "<table><thead><tr><th>MP</th><th class=\"n\">Par craft</th>"
    + "<th>Qualité mini</th><th class=\"n\">Stock</th><th class=\"n\">Crafts</th>"
    + "</tr></thead><tbody>" + lignes + "</tbody></table>";
  if (!connecte) {
    return html + (Object.keys(x.r.minimums || {}).length
      ? '<p class="faible">* qualité relevée pour cette MP dans cette recette.</p>' : "");
  }
  return html + '<div class="edition" data-edition="' + esc(x.r.id) + '">'
    + '<label>Objectif <input type="number" min="0" max="100000" data-champ="objectif" value="'
    + (x.r.objectif ?? "") + '" placeholder="' + reg.objectif + '"></label>'
    + '<label>Qualité de craft <input type="number" min="1" max="300" data-champ="qualite" value="'
    + (x.r.qualite ?? "") + '" placeholder="' + reg.qualite + '"></label>'
    + '<button type="button" class="principal" data-action="enregistrer">Enregistrer</button>'
    + '<button type="button" class="danger" data-action="supprimer">Supprimer la recette</button>'
    + '<span>Case vide : réglage commun.</span></div>';
}

function vueReglages() {
  const r = etat.reglages;
  const champ = (cle, texte, min, max) => "<label for=\"r-" + cle + "\">" + texte
    + '</label><input type="number" id="r-' + cle + '" min="' + min + '" max="' + max
    + '" value="' + r[cle] + '">';
  return '<section class="panneau"><h2>Réglages communs</h2><div class="grille">'
    + champ("objectif", "Objectif (crafts par recette)", 0, 100000)
    + champ("qualite", "Qualité de craft", 1, 300)
    + champ("stop", "Ne plus forer au-delà de (× le besoin)", 1, 100)
    + champ("rupture", "Bientôt en rupture sous (crafts)", 0, 100000)
    + '</div><button type="button" class="principal" id="r-enregistrer">Enregistrer</button></section>'
    + '<section class="panneau"><h2>Importer des recettes KipeeCraft</h2>'
    + "<p>Fichiers <code>.kc</code>. Une recette du même nom est remplacée ; "
    + "ses réglages propres (objectif, qualités) sont gardés.</p>"
    + '<input type="file" id="fichiers" accept=".kc" multiple>'
    + '<ul id="apercu"></ul>'
    + '<button type="button" class="principal" id="importer" hidden>Importer</button></section>';
}

// ------------------------------------------------------------ recettes .kc

// Meme regle que outils/page-mp.py : la recette importee ici et la meme
// lue par l'outil doivent tomber sur le meme identifiant.
function identifiant(nom) {
  const plat = nom.replace(/Œ/g, "Oe").replace(/œ/g, "oe").normalize("NFD")
    .replace(/[^\x00-\x7f]/g, "").toLowerCase();
  return plat.replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "recette";
}

function lireKc(nomFichier, texte) {
  texte = texte.replace(/\r\n/g, "\n");
  const plan = /^PatternID=(\d+)/m.exec(texte);
  const pieces = [...texte.matchAll(/^slot(\d+)=(\d+)x\s+(\S+)/gm)]
    .map((m) => ({ n: Number(m[2]), mp: m[3] }));
  if (!plan || !pieces.length) return null;
  const nom = nomFichier.replace(/\.kc$/i, "").slice(0, 80);
  return { id: identifiant(nom), nom, plan: Number(plan[1]), pieces, minimums: {} };
}

let aImporter = [];

function brancherReglages() {
  $("#r-enregistrer").addEventListener("click", async () => {
    const r = { guilde: etat.reglages.guilde };
    for (const cle of ["objectif", "qualite", "stop", "rupture"]) {
      r[cle] = Number($("#r-" + cle).value);
    }
    if (await envoyer({ action: "reglages", reglages: r })) bandeau("Réglages enregistrés");
  });
  $("#fichiers").addEventListener("change", async (ev) => {
    aImporter = [];
    const lignes = [];
    for (const f of ev.target.files) {
      // KipeeCraft ecrit en Windows-1252 : un accent lu en UTF-8 serait casse.
      const texte = new TextDecoder("windows-1252").decode(await f.arrayBuffer());
      const r = lireKc(f.name, texte);
      if (!r) { lignes.push("<li class=\"inconnue\">" + esc(f.name) + " : pas de recette</li>"); continue; }
      const existe = etat.recettes.find((e) => e.id === r.id);
      if (existe) {
        // On garde ce qui a ete regle sur le site pour cette recette.
        for (const cle of ["objectif", "qualite"]) if (existe[cle] != null) r[cle] = existe[cle];
        for (const [mp, q] of Object.entries(existe.minimums || {})) {
          if (r.pieces.some((p) => p.mp === mp)) r.minimums[mp] = q;
        }
      }
      const inconnues = r.pieces.filter((p) => !noms.mp[p.mp]).map((p) => p.mp);
      aImporter.push(r);
      lignes.push("<li>" + esc(r.nom) + ' <span class="faible">(' + (existe ? "remplace" : "nouvelle")
        + ", " + r.pieces.length + " pièces)</span>"
        + (inconnues.length ? ' <span class="inconnue">MP inconnues : ' + esc(inconnues.join(", ")) + "</span>" : "")
        + "</li>");
    }
    $("#apercu").innerHTML = lignes.join("");
    $("#importer").hidden = !aImporter.length;
    $("#importer").textContent = "Importer " + aImporter.length + " recette" + (aImporter.length > 1 ? "s" : "");
  });
  $("#importer").addEventListener("click", async () => {
    let faites = 0;
    for (const r of aImporter) {
      if (!(await envoyer({ action: "recette", recette: r }, false))) break;
      faites++;
    }
    aImporter = [];
    await relire();
    bandeau(faites + " recette" + (faites > 1 ? "s" : "") + " importée" + (faites > 1 ? "s" : ""));
  });
}

// ------------------------------------------------------------ ecriture

async function envoyer(corps, relireApres = true) {
  try {
    const r = await fetch("mp.php", { method: "POST", cache: "no-store",
      headers: { "Content-Type": "application/json", "X-MP": jeton },
      body: JSON.stringify(corps) });
    const reponse = await r.json().catch(() => ({}));
    if (r.status === 401) { verrouiller(); bandeau("Connexion expirée : reconnecte-toi", true); return false; }
    if (!r.ok) { bandeau("Refusé : " + (reponse.erreur || r.status), true); return false; }
  } catch (souci) {
    bandeau("Envoi impossible : " + souci.message, true);
    return false;
  }
  if (relireApres) await relire();
  return true;
}

async function relire() {
  etat = await lireEtat();
  afficherConnexion();
  recalculer();
}

function recetteEditee(id) {
  const zone = document.querySelector('[data-edition="' + CSS.escape(id) + '"]');
  const r = structuredClone(etat.recettes.find((e) => e.id === id));
  for (const cle of ["objectif", "qualite"]) {
    const v = zone.querySelector('[data-champ="' + cle + '"]').value.trim();
    if (v === "") delete r[cle]; else r[cle] = Number(v);
  }
  r.minimums = {};
  zone.parentElement.querySelectorAll("[data-min]").forEach((i) => {
    if (i.value.trim() !== "") r.minimums[i.dataset.min] = Number(i.value);
  });
  return r;
}

// ------------------------------------------------------------ connexion

function afficherConnexion() {
  // Recettes et reglages : aux editeurs seulement (Ludo, Luz, Nizyros).
  const editeur = Boolean(etat && etat.editeur);
  $("#connecte").textContent = etat && etat.qui ? "Connecté : " + etat.qui + " " : "";
  // Annuler la porte ne doit pas laisser la page sans moyen d'y revenir.
  $("#entrer").hidden = Boolean(etat);
  $("#entrer").textContent = "Se connecter";
  $("#sortir").hidden = !jeton;
  $("#onglet-reglages").hidden = !editeur;
  $("#onglet-recettes").hidden = !editeur;
  if (!editeur && (onglet === "reglages" || onglet === "recettes")) onglet = "forer";
}

$("#entrer").addEventListener("click", ouvrirPorte);
$("#sortir").addEventListener("click", verrouiller);
$("#porte-annuler").addEventListener("click", () => $("#porte").close());
$("#porte-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("#message").textContent = "Vérification…";
  try {
    const r = await fetch("mp.php", { method: "POST", cache: "no-store",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "entrer", nom: $("#porte-nom").value,
                             mdp: $("#porte-mdp").value }) });
    const reponse = await r.json().catch(() => ({}));
    if (!r.ok) {
      $("#message").textContent = reponse.erreur === "nom ou mot de passe"
        ? "Nom ou mot de passe incorrect."
        : reponse.erreur ? reponse.erreur.charAt(0).toUpperCase() + reponse.erreur.slice(1) + "."
        : "Refusé.";
      return;
    }
    jeton = reponse.jeton;
    try { localStorage.setItem("mp-jeton", jeton); } catch (e) {}
    $("#porte-mdp").value = "";
    $("#porte").close();
    await charger();
    bandeau(reponse.qui ? "Bienvenue, " + reponse.qui : "Bienvenue");
  } catch (souci) {
    $("#message").textContent = "Serveur injoignable.";
  }
});

// ------------------------------------------------------------ evenements

document.querySelectorAll("[data-onglet]").forEach((b) =>
  b.addEventListener("click", () => { onglet = b.dataset.onglet; afficher(); }));
document.querySelectorAll("[data-eco]").forEach((b) =>
  b.addEventListener("click", () => {
    eco = b.dataset.eco;
    document.querySelectorAll("[data-eco]").forEach((x) =>
      x.setAttribute("aria-pressed", String(x === b)));
    afficher();
  }));
$("#cherche").addEventListener("input", afficher);

$("#vue").addEventListener("click", async (ev) => {
  const bouton = ev.target.closest("[data-action]");
  if (bouton) {
    const id = bouton.closest("[data-edition]").dataset.edition;
    if (bouton.dataset.action === "enregistrer") {
      if (await envoyer({ action: "recette", recette: recetteEditee(id) })) bandeau("Recette enregistrée");
    } else if (confirm("Supprimer cette recette du site ?")) {
      if (await envoyer({ action: "supprimer", id })) { ouvertes.delete(id); bandeau("Recette supprimée"); }
    }
    return;
  }
  const ligne = ev.target.closest("tr.recette");
  if (ligne) {
    const id = ligne.dataset.id;
    if (ouvertes.has(id)) ouvertes.delete(id); else ouvertes.add(id);
    afficher();
  }
});

charger();
</script>
