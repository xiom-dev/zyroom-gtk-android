// ------------------------------------------------------------ calcul
//
// Une pile compte pour une recette si sa qualite atteint le minimum de la
// recette pour cette MP : la qualite de craft (210 par defaut), relevee MP
// par MP quand une recette l'exige (la Sha en 250 de la parure).

function fiches(mp) { return (noms.mp[mp] || {}).fiches || []; }

function utile(mp, qmin) {
  let total = 0;
  for (const f of fiches(mp)) {
    for (const [q, n] of stock.get(f) || []) if (q >= qmin) total += n;
  }
  return total;
}

function besoinsDe(recette, reglages) {
  // Une meme MP dans deux emplacements : les quantites s'additionnent.
  const qc = recette.qualite ?? reglages.qualite;
  const parMp = new Map();
  for (const p of recette.pieces) {
    const min = Math.max(qc, (recette.minimums || {})[p.mp] || 0);
    const b = parMp.get(p.mp) || { mp: p.mp, n: 0, min };
    b.n += p.n;
    parMp.set(p.mp, b);
  }
  return [...parMp.values()];
}

// **"Bientot en rupture", c'est quand il en reste un peu.** A zero, la
// rupture est deja la : la MP est simplement a forer, comme le reste. Seuls
// les 1 a 2 crafts (sous le seuil de rupture) previennent qu'on y arrive.
function presqueVide(crafts, reglages) {
  return crafts > 0 && crafts < reglages.rupture;
}

// Une recette seule : ses besoins, ses crafts possibles, la MP qui bloque.
function calculerRecette(r, reg) {
  const objectif = r.objectif ?? reg.objectif;
  const besoins = besoinsDe(r, reg);
  let possibles = Infinity, bloque = null;
  for (const b of besoins) {
    b.utile = utile(b.mp, b.min);
    b.crafts = Math.floor(b.utile / b.n);
    if (b.crafts < possibles) { possibles = b.crafts; bloque = b.mp; }
  }
  const statut = presqueVide(possibles, reg) ? "rupture"
               : possibles < objectif ? "forer" : "ok";
  return { r, objectif, besoins, possibles, bloque, statut };
}

function calculer() {
  const reg = etat.reglages;
  const recettes = [];
  const demandes = new Map();   // mp -> [{min, besoin, parCraft, recette}]
  for (const r of etat.recettes) {
    const x = calculerRecette(r, reg);
    for (const b of x.besoins) {
      if (!demandes.has(b.mp)) demandes.set(b.mp, []);
      demandes.get(b.mp).push({ min: b.min, besoin: x.objectif * b.n,
                                parCraft: b.n, recette: r });
    }
    recettes.push(x);
  }

  const mps = [];
  for (const [mp, liste] of demandes) mps.push(etatMp(mp, liste, reg));
  return { recettes, mps };
}

// Une MP : ses demandes [{min, besoin, parCraft, recette?}] face au stock.
function etatMp(mp, liste, reg) {
  // **Le manque, qualite par qualite.** Une pile en 250 sert aussi bien
  // une recette en 210, l'inverse non. Pour chaque seuil, ce que demandent
  // les recettes au moins aussi exigeantes doit tenir dans les piles au
  // moins aussi hautes : le pire ecart est ce qu'il faut forer.
  const seuils = [...new Set(liste.map((d) => d.min))].sort((a, b) => a - b);
  let manque = 0;
  for (const t of seuils) {
    const voulu = liste.filter((d) => d.min >= t)
                       .reduce((s, d) => s + d.besoin, 0);
    manque = Math.max(manque, voulu - utile(mp, t));
  }
  const qmin = seuils[0];
  const s = utile(mp, qmin);
  const besoin = liste.reduce((t, d) => t + d.besoin, 0);
  const parCraft = liste.reduce((t, d) => t + d.parCraft, 0);
  const couverture = parCraft ? Math.floor(s / parCraft) : Infinity;
  const statut = presqueVide(couverture, reg) ? "rupture"
               : manque > 0 || couverture === 0 ? "forer"
               : besoin > 0 && s > reg.stop * besoin ? "stop" : "ok";
  return { mp, nom: (noms.mp[mp] || {}).nom, eco: mp.split("_")[1],
           qmin, stock: s, besoin, manque,
           couverture, statut, nbRecettes: liste.length,
           recettes: liste.filter((d) => d.recette).map((d) => d.recette.nom) };
}

// ------------------------------------------------------------ affichage

// La sorte de la MP en etoiles, comme dans le jeu : deux pour une MP de
// choix, trois pour une excellente, quatre pour une supreme.
const ETOILES = { Basic: "", Fine: "★", Choice: "★★", Excellent: "★★★", Supreme: "★★★★" };

// "dessous" : la ligne de detail (ecosysteme, qualite, recettes), en HTML.
function nomMp(mp, dessous) {
  const n = (noms.mp[mp] || {}).nom;
  return etiquette(mp.split("_")[0], n ? enCouleur(mp.split("_")[1], esc(n))
    : '<span class="inconnue" title="Aucune fiche du jeu ne porte ce nom">' + esc(mp) + "</span>",
    dessous);
}
// Le nom dans la couleur de sa provenance.
function enCouleur(eco, html) {
  return '<span class="eco-' + esc(eco) + '">' + html + "</span>";
}
// Dans un type, les MP par provenance (dans l'ordre des filtres), puis par nom.
const ORDRE_ECOS = ["PrimeRoots", "Desert", "Forest", "Jungle", "Lake", "none"];
function parProvenance(a, b) {
  return ORDRE_ECOS.indexOf(a.eco) - ORDRE_ECOS.indexOf(b.eco)
    || (a.nom || a.mp).localeCompare(b.nom || b.mp);
}
// La sorte (nom court et etoiles) a gauche, le nom et sa ligne de detail a
// droite. `nomHtml` est deja echappe.
function etiquette(sorte, nomHtml, dessous) {
  const etoiles = '<span class="etoiles" title="' + esc(SORTES[sorte] || sorte) + '">'
    + '<span class="sorte">' + esc(COURTS[sorte] || "") + "</span>"
    + '<span class="astres">' + (ETOILES[sorte] || "") + "</span></span>";
  return '<div class="mp">' + etoiles + "<div>" + nomHtml
    + (dessous ? '<div class="faible">' + dessous + "</div>" : "") + "</div></div>";
}
// Le nom court de la sorte, celui qu'on emploie entre joueurs.
const COURTS = { Basic: "Base", Fine: "Fine", Choice: "Choix", Excellent: "XL", Supreme: "Sup" };
const SORTES = { Basic: "De base", Fine: "Fine", Choice: "De choix", Excellent: "Excellente",
                 Supreme: "Suprême" };

function retenue(texte) {
  const q = $("#cherche").value.trim().toLowerCase();
  return !q || texte.toLowerCase().includes(q);
}

// Pour une MP de boss, on la loote au lieu de la forer.
// Au survol d'un etat, son seuil et ou il se regle.
const REGLAGE = "\nSe règle dans les options (roue dentée ⚙ à côté du pseudo).";
function aideEtat(statut) {
  const reg = etat.reglages;
  return { rupture: "Moins de " + reg.rupture + " crafts possibles : bientôt en rupture." + REGLAGE,
           forer: "Stock sous l'objectif de " + reg.objectif + " crafts par recette : à forer, ou à looter sur les boss." + REGLAGE,
           stop: "Plus de " + reg.stop + " crafts en stock : ne plus stocker." + REGLAGE }[statut] || "";
}
function badge(statut, boss) {
  const texte = boss ? ETATS[statut].replace("forer", "looter") : ETATS[statut];
  const aide = aideEtat(statut);
  return '<span class="etat ' + statut + '"' + (aide ? ' title="' + esc(aide) + '"' : "") + ">" + texte + "</span>";
}

function recalculer() {
  // Un joueur recoit les resultats tout faits : les recettes ne quittent
  // pas le serveur (mp.php).
  // Un editeur autre que Xiom recoit en plus le resume de chaque recette,
  // sans sa composition -- sauf pour celles qu'il a ajoutees lui-meme.
  const siennes = (x) => (etat.recettes || []).find((r) => r.id === x.r.id);
  calcul = ghCourant ? { recettes: [], mps: [] }
    : etat.resultats
    ? { recettes: (etat.resumes || []).map((x) => siennes(x) ? calculerRecette(siennes(x), etat.reglages) : x),
        mps: etat.resultats }
    : calculer();
  // L'onglet Mobs : les besoins de La Lune, compares au stock du GH
  // affiche. Un editeur a les recettes ; un joueur a les quantites
  // demandees de chaque MP (mp.php, "demandes"), sans les recettes.
  if (!ghCourant) mpsMobs = calcul.mps;
  else if (etat.recettes) mpsMobs = calculer().mps;
  else mpsMobs = (etat.resultats || []).map((m) =>
    m.demandes ? Object.assign(etatMp(m.mp, m.demandes, etat.reglages), { nom: m.nom }) : m);
  const reg = etat.reglages;
  // Les MP du Nexus n'ont que leur onglet : hors de A stocker, Ne plus
  // stocker et Toutes les MP (les recettes les comptent toujours).
  calcul.vues = calcul.mps.filter((m) => !mpNexus(m.mp));
  const forer = calcul.vues.filter((m) => m.statut === "rupture" || m.statut === "forer");
  const stop = calcul.vues.filter((m) => m.statut === "stop");
  // Des pieces, et non un nombre de lignes : A stocker donne ce qu'il reste
  // a forer pour l'objectif, les autres onglets leur stock.
  const pieces = (liste) => nf.format(liste.reduce((t, m) => t + m.stock, 0));
  $("#n-forer").textContent = nf.format(forer.reduce((t, m) => t + m.manque, 0));
  // Au survol, le meme total coupe en deux : ce qui se fore, ce qui se loote.
  const manque = (boss) => nf.format(forer.filter((m) => deBoss(m.mp) === boss)
                                          .reduce((t, m) => t + m.manque, 0));
  // Sous l'explication de l'onglet, le total coupe en deux.
  const aide = (id) => $(id).parentElement.title.split("\n")[0];
  $("#n-forer").parentElement.title = aide("#n-forer") + "\n"
    + manque(false) + " à forer · " + manque(true) + " à looter sur les boss";
  // Ne plus stocker : le total de la colonne "MP en trop".
  $("#n-stop").textContent = nf.format(stop.reduce((t, m) => t + enTrop(m), 0));
  const trop = (boss) => nf.format(stop.filter((m) => deBoss(m.mp) === boss)
                                        .reduce((t, m) => t + enTrop(m), 0));
  $("#n-stop").parentElement.title = aide("#n-stop") + "\n"
    + trop(false) + " forées en trop · " + trop(true) + " lootées en trop";
  $("#n-toutes").textContent = pieces(calcul.vues);
  $("#n-inutiles").textContent = pieces(inutilisees().filter((m) => !m.speciale));
  const autres = autresDuHall();
  $("#n-op").textContent = pieces(inutilisees().filter((m) => m.speciale));
  $("#n-nexus").textContent = nf.format(mpsNexus().filter((m) => m.statut === "forer" || m.statut === "rupture").length);
  for (const [id, categorie] of [["coffre", "coffre"], ["outils", "outil"], ["armes", "arme"], ["plans", "plan"],
                                 ["potions", "potion"], ["feux", "feu"], ["divers", "divers"]])
    $("#n-" + id).textContent = pieces(autres.filter((m) => m.categorie === categorie));
  // Armures et bijoux : le nombre d'ensembles complets.
  const complets = (bijoux) => nf.format(ensembles(bijoux).reduce((t, g) => t + g.complets, 0));
  $("#n-tenues").textContent = complets(false);
  $("#n-bijoux").textContent = complets(true);
  $("#n-recettes").textContent = calcul.recettes.length;
  // Les boss qui ont au moins une MP a looter ou bientot en rupture.
  $("#n-mobs").textContent = mobs.filter((b) => butin(b).some((m) =>
    !tropBas(b, m) && (m.statut === "forer" || m.statut === "rupture"))).length;
  let quand = "date du relevé inconnue";
  if (releve) {
    const min = Math.round((Date.now() - releve) / 60000);
    quand = "relevé du hall " + (min < 60 ? "il y a " + min + " min"
      : "du " + releve.toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" }));
  }
  $("#resume").innerHTML = ghCourant ? esc(nomGh()) + " · " + esc(quand)
    + (ghCourant.startsWith("zr:") ? " · GH de ZyRoom-web" : " · GH personnel, visible seulement dans ce navigateur") :
    "La Lune Éternelle · " + esc(quand) + " · objectif <b>" + reg.objectif
    + " crafts</b> par recette, "
    + '<span title="' + esc(aideEtat("forer")) + '"><b>0 craft</b> = à forer / à looter</span>, '
    + '<span title="' + esc(aideEtat("rupture")) + '"><b>' + reg.rupture + " crafts</b> = bientôt en rupture</span>, "
    + '<span title="' + esc(aideEtat("stop")) + '"><b>' + reg.stop + " crafts</b> = ne plus stocker</span>";
  afficher();
}

function afficher() {
  try { sessionStorage.setItem("mp-onglet", onglet); } catch (e) {}
  document.querySelectorAll("[data-onglet]").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.onglet === onglet)));
  $("#filtres").hidden = onglet === "reglages" || onglet === "kc";
  $("#choisir-kc").hidden = onglet !== "recettes";
  // Les ecosystemes ne disent rien d'une armure ni d'un bijou.
  document.querySelectorAll("[data-eco]").forEach((b) =>
    { b.hidden = !["forer", "stop", "op", "nexus", "inutiles", "toutes", "mobs"].includes(onglet); });
  // Le menu de l'onglet ouvert s'allume et dit lequel : "MP : A stocker".
  document.querySelectorAll(".menu").forEach((m) => {
    const choisi = m.querySelector('[data-onglet][aria-pressed="true"]');
    m.querySelector(".menu-titre").setAttribute("aria-pressed", String(Boolean(choisi)));
    m.querySelector(".choix").textContent = choisi ? " : " + choisi.firstChild.textContent.trim() : "";
  });
  const vue = $("#vue");
  if (onglet === "kc") vueKc(vue);
  else if (onglet === "recettes") {
    vue.innerHTML = vueImportCourt() + vueRecettes();
    brancherImport();
  }
  else if (onglet === "reglages") { vue.innerHTML = vueReglages(); brancherReglages(); }
  else if (onglet === "inutiles") vue.innerHTML = vueInutiles();
  else if (onglet === "mobs") vue.innerHTML = vueMobs();
  else if (onglet === "op") vue.innerHTML = vueOp();
  else if (onglet === "nexus") vue.innerHTML = vueNexus();
  else if (onglet === "armes") vue.innerHTML = vueArmes();
  else if (onglet === "coffre") vue.innerHTML = vueCategorie("coffre", "MP fabrication coffre");
  else if (onglet === "outils") vue.innerHTML = vueCategorie("outil", "Outils");
  else if (onglet === "plans") vue.innerHTML = vueCategorie("plan", "Plans d'armure du Maraudeur");
  else if (onglet === "potions") vue.innerHTML = vueCategorie("potion", "Potions");
  else if (onglet === "feux") vue.innerHTML = vueCategorie("feu", "Feux d'artifice");
  else if (onglet === "divers") vue.innerHTML = vueCategorie("divers", "Autres");
  else if (onglet === "tenues" || onglet === "bijoux") vue.innerHTML = vueEnsembles(onglet === "bijoux");
  else vue.innerHTML = vueMps(onglet);
}

// ------------------------------------------------------- KipeeCraft
//
// Le simulateur vit dans kc/ : son script et Python (Pyodide) ne se chargent
// qu'a la premiere ouverture de l'onglet. La date dans l'adresse fait
// relire le script a chaque visite : il change plus souvent que le cache
// du navigateur ne le croit.

let kcCharge = null;
function vueKc(vue) {
  vue.innerHTML = "";
  kcCharge = kcCharge || new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = "kc/kc.js?v=" + Date.now();
    s.onload = ok;
    s.onerror = () => { kcCharge = null; ko(new Error("kc/kc.js introuvable")); };
    document.head.appendChild(s);
  });
  kcCharge.then(() => { if (onglet === "kc") { vue.innerHTML = ""; window.KC.afficher(vue); } })
    .catch((souci) => { vue.innerHTML = '<p class="inconnue">' + esc(souci.message) + "</p>"; });
}

// ------------------------------------------------------- MP inutilisees
//
// Ce que le hall garde sans qu'aucune recette le demande : a voir avec
// Nizyros, comme les MP en trop. Lu fiche par fiche, avec les noms du jeu :
// KipeeCraft ne connait pas toutes ces matieres.

const LETTRES_ECO = { c: "none", d: "Desert", f: "Forest", j: "Jungle", l: "Lake",
                      p: "PrimeRoots" };
// L'echelle des sortes est decalee d'une lettre entre forage et betes.
const SORTES_FORAGE = { b: "Basic", c: "Fine", d: "Choice", e: "Excellent", f: "Supreme" };
const SORTES_BETES = { a: "Basic", b: "Fine", c: "Choice", d: "Excellent", e: "Supreme" };

// Les MP du Nexus : forees, supremes (f), d'un ecosysteme de surface (Desert,
// Foret, Jungle, Lacs). Ailleurs, une supreme ne vient que des Primes (p).
// Elles servent (recettes de Nizyros) : jamais rangees parmi les inutilisees.
const MP_NEXUS = /^m\d{4}dxa[dfjl]f01\.sitem$/;

// L'onglet MP Nexus : 30 de chaque MP en stock, toutes qualites confondues.
// Sous 30 : a forer ; sous 10 : bientot en rupture ; au-dessus de 30 : ne
// plus forer ; 30 tout juste : rien a dire.
// Les deux seuils se reglent dans les options (roue dentee) ; un mp.json
// d'avant ces reglages prend 30 et 10.
const NEXUS_DEFAUT = { nexus_voulu: 30, nexus_rupture: 10 };
function seuilsNexus() {
  const r = (etat && etat.reglages) || {};
  return [r.nexus_voulu ?? NEXUS_DEFAUT.nexus_voulu, r.nexus_rupture ?? NEXUS_DEFAUT.nexus_rupture];
}
function aideNexus(statut) {
  const [voulu, rupture] = seuilsNexus();
  return { rupture: "Moins de " + rupture + " en stock : bientôt en rupture.",
           forer: "Moins de " + voulu + " en stock : à forer au Nexus.",
           stop: "Plus de " + voulu + " en stock : ne plus forer." }[statut] + REGLAGE;
}
// Une MP des recettes dont toutes les fiches sont des MP du Nexus.
function mpNexus(mp) {
  const f = fiches(mp);
  return f.length > 0 && f.every((x) => MP_NEXUS.test(x));
}

// Toutes les MP du Nexus que le jeu connait, meme absentes du hall.
function mpsNexus() {
  const [voulu, rupture] = seuilsNexus();
  const liste = [];
  for (const [fiche, info] of Object.entries(noms.fiches || {})) {
    if (!MP_NEXUS.test(fiche)) continue;
    const parQualite = new Map();
    for (const [q, n] of stock.get(fiche) || []) parQualite.set(q, (parQualite.get(q) || 0) + n);
    const total = [...parQualite.values()].reduce((t, n) => t + n, 0);
    liste.push({
      fiche, nom: info[0], anglais: info[1], sorte: SORTES_FORAGE[fiche[9]] || "",
      eco: LETTRES_ECO[fiche[8]] || "", type: typeDuNom(info[0]), stock: total,
      piles: [...parQualite].sort((a, b) => b[0] - a[0]),
      statut: total < rupture ? "rupture" : total < voulu ? "forer" : total > voulu ? "stop" : "",
    });
  }
  return liste;
}

function vueNexus() {
  const liste = mpsNexus().filter((m) => (!eco || m.eco === eco) && retenue(m.nom + " " + m.anglais));
  const titre = "MP du Nexus · " + seuilsNexus()[0] + " de chaque";
  // Deux colonnes de meme hauteur, sans jamais couper une matiere : parmi
  // toutes les facons de repartir les matieres, celle ou les colonnes ont le
  // plus pres le meme nombre de lignes (une de titre par matiere, plus ses
  // MP) ; chaque colonne reste dans l'ordre alphabetique. Au-dela de 16
  // matieres, une seule coupure dans l'ordre, pour rester rapide.
  const types = [...new Set(liste.map((m) => m.type))].sort((a, b) => a.localeCompare(b));
  if (liste.length < 25 || types.length < 2) return '<div class="deux">' + tableNexus(liste, titre) + "</div>";
  const lignes = types.map((t) => 1 + liste.filter((m) => m.type === t).length);
  const total = lignes.reduce((x, y) => x + y, 0);
  let choix = 1, ecart = Infinity;
  if (types.length <= 16) {
    // La premiere matiere toujours a gauche : chaque repartition une seule fois.
    for (let masque = 1; masque < (1 << types.length); masque += 2) {
      let gauche = 0;
      for (let i = 0; i < types.length; i++) if (masque >> i & 1) gauche += lignes[i];
      if (Math.abs(total - 2 * gauche) < ecart) { ecart = Math.abs(total - 2 * gauche); choix = masque; }
    }
  } else {
    let gauche = 0;
    for (let k = 1; k < types.length; k++) {
      gauche += lignes[k - 1];
      if (Math.abs(total - 2 * gauche) < ecart) { ecart = Math.abs(total - 2 * gauche); choix = (1 << k) - 1; }
    }
  }
  const moitie = new Set(types.filter((t, i) => choix >> i & 1));
  return '<div class="deux">' + tableNexus(liste.filter((m) => moitie.has(m.type)), titre)
    + tableNexus(liste.filter((m) => !moitie.has(m.type)), titre + " (suite)") + "</div>";
}

function tableNexus(liste, nom) {
  const titre = "<h2>" + nom + "</h2>";
  if (!liste.length) return "<div>" + titre + "<p>Aucune MP.</p></div>";
  const groupes = new Map();
  for (const m of liste) {
    if (!groupes.has(m.type)) groupes.set(m.type, []);
    groupes.get(m.type).push(m);
  }
  const lignes = [...groupes.keys()].sort((a, b) => a.localeCompare(b)).map((t) => {
    const membres = groupes.get(t).sort(parProvenance);
    const symbole = '<span class="symbole" style="background-image:url(\''
      + "https://api.ryzom.com/item_icon.php?sheetid=" + encodeURIComponent(membres[0].fiche)
      + '&c=1\')"></span>';
    return '<tr class="type"><td colspan="4">' + symbole + esc(t) + "</td></tr>"
      + membres.map((m) => "<tr><td>" + etiquette(m.sorte, enCouleur(m.eco, esc(m.nom)), ECOS[m.eco] || "")
        + '</td><td class="n"><b>' + nombre(m.stock) + "</b></td>"
        + '<td class="faible">' + m.piles.map(([q, n]) => '<span class="pile">Q' + q + " ×" + nombre(n) + "</span>").join(" · ")
        + "</td><td>" + (m.statut ? '<span class="etat ' + m.statut + '" title="' + esc(aideNexus(m.statut)) + '">'
          + ETATS[m.statut] + "</span>" : "") + "</td></tr>").join("");
  }).join("");
  return "<div>" + titre + '<div class="cadre collant"><table class="types"><thead><tr><th>MP'
    + VIDE + '</th><th class="n">Stock</th><th>Qualités</th><th>État</th></tr></thead><tbody>' + lignes
    + "</tbody></table></div></div>";
}

function inutilisees() {
  const utilisees = new Set(calcul.mps.flatMap((m) => fiches(m.mp)));
  const liste = [];
  for (const [fiche, piles] of stock) {
    const info = (noms.fiches || {})[fiche];
    if (!info || utilisees.has(fiche) || MP_NEXUS.test(fiche)) continue;
    const foree = fiche.slice(5, 8) === "dxa";
    const parQualite = new Map();
    for (const [q, n] of piles) parQualite.set(q, (parQualite.get(q) || 0) + n);
    liste.push({
      fiche, nom: info[0], anglais: info[1], boss: !foree,
      // Forees sans ecosysteme (lettre "c") : MP d'OP, cristaux de Maraudeur,
      // larves de Kitin. Elles ont leur onglet, hors des inutilisees. Les
      // loots communs des boss (Yubo...) restent des inutilisees.
      speciale: foree && fiche[8] === "c",
      sorte: (foree ? SORTES_FORAGE : SORTES_BETES)[fiche[9]] || "",
      eco: LETTRES_ECO[fiche[8]] || "", type: typeDuNom(info[0]),
      stock: [...parQualite.values()].reduce((t, n) => t + n, 0),
      piles: [...parQualite].sort((a, b) => b[0] - a[0]),
    });
  }
  return liste;
}

// Le groupe d'une ligne des onglets tires de noms.autres (outils, armes...).
function typeAutre(categorie, fiche, nom) {
  if (categorie === "coffre")
    return fiche === "mp_soft.sitem" || fiche === "mp_hard.sitem" ? "MP génériques" : "Pièces de coffre";
  // Un outil de Kami ou de Karavan se range avec les autres de sa sorte :
  // "Pioche de forage Greslin-Duk" -> "Pioche de forage".
  if (categorie === "outil") return nom.replace(/\s+\S+-(Duk|Gen|Jen|Mar)$/, "").replace(/ \/ .*$/, "");
  // "Potion de mage divine" -> "Potion de mage".
  if (categorie === "potion") return nom.replace(/\s+(basique|mineure|majeure|excellente|suprême|divine)$/i, "");
  // "Munition perforante de Ma-kam" -> "Munition perforante".
  if (categorie === "feu") return nom.replace(/\s+type\s.*$/, "");
  // "Plan d'armure du Maraudeur - Bottes partie I" -> "Bottes".
  if (categorie === "plan") return (nom.split(" - ")[1] || nom).replace(/\s+partie\s.*$/, "");
  // "Plan d'armure du Maraudeur - Bottes partie I" -> "Plan d'armure du Maraudeur".
  if (categorie === "divers" && / - /.test(nom)) return nom.split(" - ")[0];
  if (/^Munition/.test(nom)) return nom.replace(/\s+de\s.*$/, "");
  if (/^Ampli/.test(nom)) return "Amplificateurs magiques";
  return nom.split(" ")[0];
}

// Le type d'une MP d'apres son nom du jeu, sans la sorte : "Dent suprême /
// Bolobi" -> "Dent", "Fragment suprême de carapace Intelligente / Désert" ->
// "Fragment de carapace".
function typeDuNom(nom) {
  const mots = nom.split(" / ")[0]
    .replace(/\s+(de base|fines?|fins?|de choix|excellente?s?|suprêmes?)(?=\s|$)/gi, "")
    .split(/\s+/);
  if (mots.length > 1 && /^(Fragment|Mesure|Fagot|Boucles?)$/i.test(mots[0])) {
    const n = mots[1].startsWith("d'") ? 2 : mots[2] === "grosse" ? 4 : 3;
    return mots.slice(0, n).join(" ");
  }
  return mots[0];
}

function vueInutiles() {
  const liste = inutilisees().filter((m) =>
    !m.speciale && (!eco || m.eco === eco) && retenue(m.nom + " " + m.anglais));
  return '<div class="deux">' + tableInutiles(liste.filter((m) => !m.boss), "MP forées")
    + tableInutiles(liste.filter((m) => m.boss), "MP lootées sur les boss") + "</div>";
}

function vueOp() {
  const liste = inutilisees().filter((m) =>
    m.speciale && (!eco || m.eco === eco) && retenue(m.nom + " " + m.anglais));
  return '<div class="deux">' + tableInutiles(liste, "MP d'OP, cristaux et larves") + "</div>";
}

// Une categorie de noms.autres en un tableau ; assez longue (Autres), elle se
// partage en deux colonnes, sans couper un groupe.
function vueCategorie(categorie, titre) {
  const liste = autresDuHall().filter((m) => m.categorie === categorie && retenue(m.nom));
  const types = [...new Set(liste.map((m) => m.type))].sort((a, b) => a.localeCompare(b));
  if (liste.length < 25 || types.length < 2) return '<div class="deux">' + tableInutiles(liste, titre) + "</div>";
  const moitie = new Set(types.slice(0, Math.ceil(types.length / 2)));
  return '<div class="deux">' + tableInutiles(liste.filter((m) => moitie.has(m.type)), titre)
    + tableInutiles(liste.filter((m) => !moitie.has(m.type)), titre + " (suite)") + "</div>";
}

// Armes : la melee a gauche (avec les amplificateurs), le tir a droite, les
// boucliers et les munitions dessous. La lettre apres le peuple le dit :
// "icfm..." melee, "icfr..." tir, "icfp..." munition, "icfs..." bouclier ;
// "icokamm..." pour les armes des Kamis et des Karavaniers.
function vueArmes() {
  const liste = autresDuHall().filter((m) => m.categorie === "arme" && retenue(m.nom));
  const sorte = (m) => (m.fiche.match(/^ic(?:o[a-z]{3}|[a-z])([mrps])/) || [])[1] || "m";
  return '<div class="deux"><div>' + tableInutiles(liste.filter((m) => sorte(m) === "m"), "Armes de mêlée")
    + tableInutiles(liste.filter((m) => sorte(m) === "s"), "Boucliers") + "</div><div>"
    + tableInutiles(liste.filter((m) => sorte(m) === "r"), "Armes de tir")
    + tableInutiles(liste.filter((m) => sorte(m) === "p"), "Munitions") + "</div></div>";
}

// Le reste du hall qui compte pour la guilde : outils de craft et de forage,
// MP generiques molles et dures, pieces des coffres, armes, potions, feux
// d'artifice et le reste (noms.autres, fabrique par outils/page-mp.py, porte
// la categorie).
function autresDuHall() {
  const liste = [];
  for (const [fiche, piles] of stock) {
    const info = (noms.autres || {})[fiche];
    if (!info) continue;
    const categorie = info[2];
    const parQualite = new Map();
    for (const [q, n] of piles) parQualite.set(q, (parQualite.get(q) || 0) + n);
    liste.push({
      fiche, nom: info[0], anglais: info[1], categorie, sorte: "", eco: "",
      type: typeAutre(categorie, fiche, info[0]),
      stock: [...parQualite.values()].reduce((t, n) => t + n, 0),
      piles: [...parQualite].sort((a, b) => b[0] - a[0]),
    });
  }
  return liste;
}

function tableInutiles(liste, nom) {
  const titre = "<h2>" + nom + "</h2>";
  if (!liste.length) return "<div>" + titre + "<p>Aucune MP.</p></div>";
  const groupes = new Map();
  for (const m of liste) {
    if (!groupes.has(m.type)) groupes.set(m.type, []);
    groupes.get(m.type).push(m);
  }
  const lignes = [...groupes.keys()].sort((a, b) => a.localeCompare(b)).map((t) => {
    const membres = groupes.get(t).sort(parProvenance);
    const symbole = '<span class="symbole" style="background-image:url(\''
      + "https://api.ryzom.com/item_icon.php?sheetid=" + encodeURIComponent(membres[0].fiche)
      + '&c=1\')"></span>';
    return '<tr class="type"><td colspan="3">' + symbole + esc(t) + "</td></tr>"
      + membres.map((m) => "<tr><td>" + etiquette(m.sorte, enCouleur(m.eco, esc(m.nom)), ECOS[m.eco] || "")
        + '</td><td class="n"><b>' + nombre(m.stock) + "</b></td>"
        + '<td class="faible">' + m.piles.map(([q, n], i, tout) => {
          const fin = i < tout.length - 1 ? " ·" : "";
          // Les armes entamees de la pile, chacune avec sa durabilite ; une
          // pile en parfait etat reste nue. Chaque valeur est insecable, la
          // liste peut passer a la ligne entre deux valeurs.
          const usees = m.categorie === "arme" ? entamees.get(m.fiche + "|" + q) || [] : [];
          if (!usees.length) return '<span class="pile">Q' + q + " ×" + nombre(n) + fin + "</span>";
          return '<span class="pile">Q' + q + " ×" + nombre(n) + "</span> ("
            + usees.map(([hp, max, x], j) => '<span class="pile">' + hp + "/" + max + (x > 1 ? " ×" + x : "")
              + (j < usees.length - 1 ? "," : ")" + fin) + "</span>").join(" ");
        }).join(" ")
        + "</td></tr>").join("");
  }).join("");
  return "<div>" + titre + '<div class="cadre collant"><table class="types"><thead><tr><th>MP' + VIDE + "</th>"
    // Sous le titre, le total des lignes affichees, comme dans les autres onglets.
    + '<th class="n">Stock<br><span class="total">'
    + nombre(liste.reduce((t, m) => t + m.stock, 0)) + "</span></th><th>Qualités" + VIDE + "</th></tr></thead><tbody>" + lignes
    + "</tbody></table></div></div>";
}

// ------------------------------------------------------- Tenues et bijoux
//
// Les armures et bijoux du hall, ranges en ensembles complets (demande de
// Nizyros) : meme nom, meme qualite -- et, pour un bijou, meme bonus. Une
// fiche dit tout : "ic", le peuple, "a" + poids + piece pour une armure,
// "j" + piece pour un bijou, puis la variante ("_2", "_3", "_b").

// [lettre, en-tete, nombre voulu, singulier, pluriel]
const PIECES_ARMURE = [["h", "Casque", 1, "casque", "casques"],
                       ["v", "Gilet", 1, "gilet", "gilets"],
                       ["p", "Pantalon", 1, "pantalon", "pantalons"],
                       ["s", "Manches", 1, "manches", "manches"],
                       ["g", "Gants", 1, "gants", "gants"],
                       ["b", "Bottes", 1, "bottes", "bottes"]];
// Une armure legere n'a pas de casque.
const POIDS = { l: "Légère", m: "Moyenne", h: "Lourde" };
// Les pieces d'une parure, et combien il en faut de chacune.
const PIECES_BIJOU = [["d", "Diadème", 1, "diadème", "diadèmes"],
                      ["e", "Boucles<br>d'oreilles", 2, "boucle d'oreille", "boucles d'oreilles"],
                      ["p", "Pendentif", 1, "pendentif", "pendentifs"],
                      ["r", "Bagues", 2, "bague", "bagues"],
                      ["b", "Bracelets", 2, "bracelet", "bracelets"],
                      ["a", "Anneaux<br>de cheville", 2, "anneau de cheville", "anneaux de cheville"]];
// Les quatre jauges, avec les couleurs des gouttes de ZyRoom.
const BONUS = [["v", "Vie", "#e2696a"], ["s", "Sève", "#4caf50"],
               ["e", "Endurance", "#a97fd0"], ["c", "Concentration", "#4a90d9"]];

function ensembles(bijoux) {
  const groupes = new Map();
  for (const [cle, n] of equipement) {
    const [fiche, q, bonus] = cle.split("|");
    // La robe de mage ("ic.acp", "Pantalon d'armure de mage") remplace le
    // pantalon d'une armure legere : elle compte comme le pantalon leger du
    // meme peuple et de la meme variante ("iczacp_3" -> "iczalp_3").
    const robe = !bijoux && /^ic[a-z]acp/.test(fiche);
    const vue = robe ? fiche.replace(/^(ic[a-z]a)cp/, "$1lp") : fiche;
    const m = vue.match(bijoux ? /^(ic[a-z]j)([a-z])(.*)$/ : /^(ic[a-z]a([lmh]))([a-z])(.*)$/);
    if (!m) continue;
    const piece = bijoux ? m[2] : m[3];
    const base = bijoux ? m[1] + "?" + m[3] : m[1] + "?" + m[4];
    // Armures comme bijoux se trient aussi par bonus : une piece en vie ne
    // complete pas une armure en seve.
    const id = base + "|" + q + "|" + bonus;
    if (!groupes.has(id)) {
      groupes.set(id, { id, base, q: Number(q), bonus,
                        poids: bijoux ? "" : m[2], pieces: {}, fiches: [], robes: 0 });
    }
    const g = groupes.get(id);
    g.pieces[piece] = (g.pieces[piece] || 0) + n;
    // La durabilite d'un ensemble : celle de sa piece la plus entamee.
    const u = usure.get(cle);
    if (u && (!g.usure || u[0] * g.usure[1] < g.usure[0] * u[1])) g.usure = u;
    if (robe) g.robes += n;
    g.fiches.push(fiche);
  }
  return [...groupes.values()].map((g) => {
    const besoin = (bijoux ? PIECES_BIJOU
      : PIECES_ARMURE.filter(([p]) => p !== "h" || g.poids !== "l")).map(([p, , n]) => [p, n]);
    // Les ensembles complets, et ce qu'il manque a chaque piece pour egaler
    // la plus nombreuse -- le "compte juste" (Ludo). Les pieces vont par
    // paires dans une parure : on compte en ensembles, non en pieces.
    const ensemblesDe = besoin.map(([p, n]) => (g.pieces[p] || 0) / n);
    const complets = Math.min(...ensemblesDe.map(Math.floor));
    const visee = Math.ceil(Math.max(...ensemblesDe));
    g.besoin = besoin;
    g.complets = complets;
    g.moins = Math.min(...ensemblesDe);
    g.plus = Math.max(...ensemblesDe);
    g.manque = besoin.map(([p, n]) => [p, visee * n - (g.pieces[p] || 0)]).filter(([, x]) => x > 0);
    g.nom = nomEnsemble(g, bijoux);
    return g;
  });
}

// "Gilet Kostom" -> "Kostom" ; "Bague fyros de qualité Haute" -> "Fyros de
// qualité Haute". Le nom d'une piece, sans le mot de la piece.
function nomEnsemble(g, bijoux) {
  // Le nom d'une piece d'armure legere plutot que celui d'une robe de mage,
  // qui porte un autre nom ("Zo'Lin-ko" pour l'ensemble "Zo'Nin-ka").
  const fiche = g.fiches.find((f) => !/^ic[a-z]acp/.test(f)) || g.fiches[0];
  const n = (noms.equipements || {})[fiche] || g.base;
  let reste = bijoux
    ? n.replace(/^(Diadème|Boucle d'oreille|Pendentif|Bague|Bracelet|Anneau de cheville)\s+/i, "")
    : n.replace(/^\S+\s+(?=\S)/, "").replace(/^(lourde?s?|légères?|légers?|moyennes?)\s*\/\s*/i, "");
  reste = reste.charAt(0).toUpperCase() + reste.slice(1);
  return bijoux ? reste : POIDS[g.poids] + " · " + reste;
}

function gouttes(bonus) {
  return BONUS.filter(([l]) => bonus.includes(l)).map(([, nom, couleur]) =>
    '<span class="goutte" title="' + nom + '" style="background:' + couleur + '"></span>').join("");
}

function vueEnsembles(bijoux) {
  const pieces = bijoux ? PIECES_BIJOU : PIECES_ARMURE;
  const motDe = Object.fromEntries(pieces.map(([p, , , un, plusieurs]) => [p, [un, plusieurs]]));
  const liste = ensembles(bijoux).filter((g) => retenue(g.nom + " " + g.base))
    // Legeres, moyennes puis lourdes ; dans chaque poids, des plus basses
    // qualites aux plus hautes (Ludo).
    .sort((a, b) => "lmh".indexOf(a.poids) - "lmh".indexOf(b.poids) || a.q - b.q
                    || a.nom.localeCompare(b.nom) || a.bonus.localeCompare(b.bonus));
  if (!equipement.size) return "<p>Le relevé du hall ne publie pas encore les armures et les bijoux.</p>";
  if (!liste.length) return "<p>Aucun ensemble.</p>";
  const resume = (paires) => paires.map(([p, x]) => x + " " + motDe[p][x > 1 ? 1 : 0]).join(", ");
  const lignes = liste.map((g) => "<tr><td>"
      + (bijoux ? esc(g.nom) : '<span class="poids-' + g.poids + '">' + esc(g.nom) + "</span>")
      + '<div class="faible">Q' + g.q
      + (g.usure ? ' <span title="Durabilité de la pièce la plus usée">· ' + g.usure[0] + "/" + g.usure[1] + "</span>" : "")
      + " " + gouttes(g.bonus) + "</div></td>"
      + '<td class="n complets"><b>' + g.complets + "</b></td>"
      + pieces.map(([p]) => {
        const voulu = g.besoin.find(([b]) => b === p);
        if (!voulu) return '<td class="n faible">·</td>';
        const n = g.pieces[p] || 0;
        const e = n / voulu[1];
        // Toutes les pieces au meme compte : l'ensemble est juste, tout en bleu.
        const classe = e === g.plus ? " plus" : e === g.moins ? " moins" : "";
        // Le pantalon d'une armure legere peut etre une robe de mage : dit dessous.
        const robes = p === "p" && g.robes ? '<div class="faible" title="Robes de mage (pantalons d\'armure de mage)">dont '
          + g.robes + (g.robes > 1 ? " robes" : " robe") + "</div>" : "";
        return '<td class="n' + classe + '">' + n + robes + "</td>";
      }).join("")
      + "<td>" + (g.manque.length ? '<div class="manque">Manque : ' + esc(resume(g.manque)) + "</div>" : "")
      + "</td></tr>").join("");
  return '<div class="cadre collant"><table class="ensembles"><thead><tr><th>' + (bijoux ? "Parure" : "Armure") + "</th>"
    + '<th class="n" title="Ensembles complets">Complets<br><span class="total">'
    + nombre(liste.reduce((t, g) => t + g.complets, 0)) + "</span></th>"
    + pieces.map(([, nom, n]) => '<th class="n">' + nom + (n > 1 ? "<br>(×" + n + ")" : "") + "</th>").join("")
    + "<th></th></tr></thead><tbody>" + lignes + "</tbody></table></div>";
}

// Ce qui depasse le seuil "ne plus forer" (50 fois le besoin) : ce qu'on
// peut supprimer ou ecouler sans jamais redescendre sous ce seuil.
function enTrop(m) {
  return Math.max(0, m.stock - etat.reglages.stop * m.besoin);
}

function vueMps(quoi) {
  const ORDRE = { rupture: 0, forer: 1, ok: 2, stop: 3 };
  let liste = (calcul.vues || calcul.mps).filter((m) =>
    (!eco || m.eco === eco) && retenue((m.nom || m.mp) + " " + m.mp.replace(/_/g, " ") + " " + (m.recettes || []).join(" ")));
  if (quoi === "forer") {
    liste = liste.filter((m) => m.statut === "rupture" || m.statut === "forer");
    // Les MP a forer d'abord, les "bientot en rupture" ensuite (choix de
    // Ludo) ; dans chaque groupe, les plus gros manques en tete.
    const GROUPE = { forer: 0, rupture: 1 };
    liste.sort((a, b) => GROUPE[a.statut] - GROUPE[b.statut] || b.manque - a.manque);
  } else if (quoi === "stop") {
    liste = liste.filter((m) => m.statut === "stop");
    liste.sort((a, b) => b.couverture - a.couverture);
  } else {
    liste.sort((a, b) => ORDRE[a.statut] - ORDRE[b.statut]
                         || (a.nom || a.mp).localeCompare(b.nom || b.mp));
  }
  // Deux tableaux cote a cote : les MP forees a gauche, celles des boss a
  // droite (toutes les MP d'animaux du hall se lootent sur des boss).
  return '<div class="deux">'
    + tableMps(liste.filter((m) => !deBoss(m.mp)), quoi, false)
    + tableMps(liste.filter((m) => deBoss(m.mp)), quoi, true) + "</div>";
}

// Une MP de forage porte la famille "dxa" dans sa fiche du jeu ; toutes les
// autres viennent d'animaux.
// La ligne des totaux, laissee vide sous un titre qui n'en a pas : les
// titres restent tous sur la meme ligne, au-dessus de celle des totaux.
const VIDE = '<br><span class="total">&nbsp;</span>';

function deBoss(mp) {
  const fiche = ((noms.mp[mp] || {}).fiches || [])[0];
  return !!fiche && fiche.slice(5, 8) !== "dxa";
}

// Le nom francais du type de MP, d'apres le dernier mot du nom KipeeCraft.
const TYPES = {
  Amber: "Ambre", Bark: "Écorce", Beak: "Bec", Bone: "Os", Bud: "Bourgeon",
  Claw: "Griffe", Eye: "Œil", Fang: "Croc", Fiber: "Fibre", Hoof: "Sabot", Horn: "Corne",
  Leather: "Cuir", Ligament: "Ligament", Mandible: "Mandibule", Moss: "Mousse",
  Mushroom: "Champignon", Nail: "Ongle", Oil: "Huile", Pelvis: "Bassin",
  Resin: "Résine", Rostrum: "Rostre", Sap: "Sève", Secretion: "Sécrétion", Seed: "Graine",
  Shell: "Carapace", Skin: "Peau", Spine: "Épine", Sting: "Dard", Tail: "Queue",
  Tooth: "Dent", Trunk: "Trompe", Whiskers: "Moustaches", Wing: "Aile", Wood: "Bois",
  WoodNode: "Nœud de bois",
};
function typeFr(t) { return TYPES[t] || t; }

function tableMps(liste, quoi, boss) {
  const verbe = boss ? "looter" : "forer";
  const titre = "<h2>" + (boss ? "MP lootées sur les boss" : "MP forées") + "</h2>";
  if (!liste.length) {
    return "<div>" + titre + "<p>" + (quoi === "forer" ? "Rien à " + verbe
              + " : toutes les recettes ont leur objectif."
            : quoi === "stop" ? "Aucune MP en trop." : "Aucune MP.") + "</p></div>";
  }
  // Quatre colonnes, et une cinquieme pour ce qu'il faut forer. "Crafts
  // possibles" compte toutes les recettes ensemble : avec 15 MP, un casque
  // a 5 et un pantalon a 3 ne font qu'un tour complet (8 MP), pas trois.
  const forer = quoi === "forer";
  const trop = quoi === "stop";
  const colonnes = 4 + (forer || trop ? 1 : 0);
  // Regroupees par type (graines, cuirs...), types dans l'ordre alphabetique,
  // et dans chaque type l'ordre de l'onglet.
  const groupes = new Map();
  liste.forEach((m) => {
    const t = m.mp.split("_")[3];
    if (!groupes.has(t)) groupes.set(t, []);
    groupes.get(t).push(m);
  });
  const ordre = [...groupes.keys()].sort((a, b) => typeFr(a).localeCompare(typeFr(b)));
  const lignes = ordre.map((t) => {
    const fiche = ((noms.mp[groupes.get(t)[0].mp] || {}).fiches || [])[0];
    const symbole = fiche ? '<span class="symbole" style="background-image:url(\''
      + "https://api.ryzom.com/item_icon.php?sheetid=" + encodeURIComponent(fiche)
      + '&c=1\')"></span>' : "";
    return '<tr class="type"><td colspan="' + colonnes + '">' + symbole + esc(typeFr(t))
      + "</td></tr>" + (quoi === "toutes" ? groupes.get(t) : groupes.get(t).sort(parProvenance))
        .map(ligneMp).join("");
  }).join("");
  // Le total d'une colonne, sous son titre : celui des lignes affichees.
  function total(valeur) {
    return '<span class="total">' + nombre(liste.reduce((t, m) => t + Math.max(0, valeur(m)), 0))
      + "</span>";
  }
  function ligneMp(m) {
    return "<tr><td>" + nomMp(m.mp, ECOS[m.eco]
      + " · Q" + m.qmin + "+ · " + m.nbRecettes + " recette"
      + (m.nbRecettes > 1 ? "s" : "")) + "</td>"
      + "<td>" + badge(m.statut, boss) + "</td>"
      + '<td class="n">' + nombre(m.stock) + "</td>"
      + '<td class="n"><b>' + nombre(m.couverture) + "</b></td>"
      + (forer ? '<td class="n">' + (m.manque > 0 ? nombre(m.manque) : "—") + "</td>" : "")
      + (trop ? '<td class="n"><b>' + nombre(enTrop(m)) + "</b></td>" : "")
      + "</tr>";
  }
  return "<div>" + titre + '<div class="cadre collant"><table class="types"><thead><tr><th>MP' + VIDE + "</th><th>État" + VIDE + "</th>"
    + '<th class="n" title="Ce que le hall contient, à la qualité demandée ou plus">Stock'
    + "<br>" + total((m) => m.stock) + "</th>"
    + '<th class="n" title="Crafts de toutes les recettes qui utilisent cette MP, faits ensemble">Crafts<br>possibles<br>'
    + total((m) => m.couverture) + "</th>"
    + (forer ? '<th class="n" title="MP à ' + verbe + ' pour atteindre ' + etat.reglages.objectif
               + ' crafts de chaque recette">À ' + verbe + "<br>" + total((m) => m.manque) + "</th>" : "")
    + (trop ? '<th class="n" title="Au-delà de ' + etat.reglages.stop
               + ' fois le besoin : à supprimer ou à écouler, à voir avec Nizyros">MP en trop<br>'
               + total(enTrop) + "</th>" : "")
    + "</tr></thead><tbody>" + lignes + "</tbody></table></div></div>";
}

// ------------------------------------------------------------ Mobs
//
// Un roi lache les MP supremes de son espece, un nomme les excellentes, dans
// l'ecosysteme de sa region et a sa qualite (roi 220 ou 270, nomme 210 ou
// 260). Une MP ne compte que si une recette la demande.

function debutMp(b) {
  return (b.roi ? "Supreme" : "Excellent") + "_" + b.eco + "_" + b.espece + "_";
}
function butin(b) {
  return mpsMobs.filter((m) => m.mp.startsWith(debutMp(b)));
}
// Un boss dont aucune recette ne demande les MP : toutes ses MP, tirees des
// noms du jeu par outils/page-mobs.py ([fiche, type]), avec le stock du hall
// toutes qualites confondues. "mp" garde la forme Grade_Eco_Espece_Type.
function butinLibre(b) {
  return (b.mps || []).map(([fiche, type]) => ({
    mp: debutMp(b) + type, nom: fiche,
    stock: (stock.get(fiche) || []).reduce((t, [, n]) => t + n, 0) }));
}
// Un nomme en 210 ne sert pas une recette en 250 : ses MP vont a part,
// dans la derniere section, et ne comptent pas dans l'etat du hall.
function tropBas(b, m) { return m.qmin > b.q; }

// Les sections, de la plus pressante a la plus tranquille, puis les boss
// trop bas. Un boss dont les MP n'ont pas toutes le meme etat parait dans
// plusieurs sections, avec chaque fois les MP de cet etat.
const SECTIONS_MOBS = ["forer", "rupture", "stop", "ok", "bas"];
function dansSection(b, m, section) {
  return section === "bas" ? tropBas(b, m) : !tropBas(b, m) && m.statut === section;
}

// Les boss affiches : filtres de qualite, d'ecosysteme et recherche.
function mobsRetenus() {
  return mobs.filter((b) => (!qualiteMob || b.q === qualiteMob) && (!eco || b.eco === eco))
    .map((b) => ({ b, mps: butin(b) }))
    .filter((x) => retenue(x.b.nom + " " + x.b.espece + " " + x.b.lieu + " "
      + x.mps.map((m) => (m.nom || m.mp) + " " + typeFr(m.mp.split("_")[3])).join(" ")));
}

// Les noms seuls des rois (ou des nommes) affiches qui ont une MP a looter
// ou bientot en rupture, chacun une seule fois.
function nomsALooter(roi) {
  const urgent = (x) => x.mps.some((m) => dansSection(x.b, m, "forer") || dansSection(x.b, m, "rupture"));
  const liste = mobsRetenus().filter((x) => x.b.roi === roi && urgent(x))
    .sort((a, b) => b.b.q - a.b.q || a.b.nom.localeCompare(b.b.nom));
  return [...new Set(liste.map((x) => x.b.nom))];
}

function vueMobs() {
  if (!mobs.length) return '<p class="inconnue">Liste des boss introuvable (mobs.json).</p>';
  const qualites = [0, 210, 220, 260, 270].map((q) =>
    '<button type="button" data-qmob="' + q + '" aria-pressed="' + (q === qualiteMob) + '">'
    + (q ? "Q" + q : "Toutes") + "</button>").join("");
  const retenus = mobsRetenus();
  const colonne = (roi) => {
    const liste = retenus.filter((x) => x.b.roi === roi);
    // Le bouton de copie a cote du titre de sa colonne.
    const titre = "<h2>" + (roi ? "Rois" : "Nommés") + ' <span class="compte">'
      + new Set(liste.map((x) => x.b.nom)).size + "</span>"
      + ' <button type="button" class="principal copier-mobs" data-copier="' + (roi ? "rois" : "nommes")
      + '" title="Copie les noms des ' + (roi ? "rois" : "nommés") + " affichés qui ont une MP à looter "
      + 'ou bientôt en rupture, un par ligne">Copier les ' + (roi ? "rois" : "nommés") + " à looter</button></h2>";
    if (!liste.length) return "<div>" + titre + "<p>Aucun boss utile.</p></div>";
    return "<div>" + titre + SECTIONS_MOBS.map((statut) => {
      const lignes = liste.map((x) => ({ b: x.b, mps: x.mps.filter((m) => dansSection(x.b, m, statut)) }))
        .filter((x) => x.mps.length)
        .sort((a, b) => b.b.q - a.b.q || a.b.nom.localeCompare(b.b.nom));
      // Les boss dont aucune recette ne demande les MP : en bas de Suffisant.
      if (statut === "ok") lignes.push(...liste.filter((x) => !x.mps.length)
        .sort((a, b) => b.b.q - a.b.q || a.b.nom.localeCompare(b.b.nom)));
      if (!lignes.length) return "";
      const titre = statut === "bas"
        ? '<span class="etat bas" title="Le boss lâche ses MP en qualité plus basse que celle demandée par les recettes">Qualité trop basse</span>'
        : badge(statut, true);
      return "<h3>" + titre + ' <span class="compte">' + lignes.length + "</span></h3>"
        + '<div class="cadre"><table class="mobs"><tbody>' + lignes.map(ligneMob).join("") + "</tbody></table></div>";
    }).join("") + "</div>";
  };
  // Un autre GH affiche : on le dit, les chiffres restent ceux de La Lune.
  return (ghCourant ? '<p class="faible">Besoins des recettes de ' + esc(LUNE)
          + ", comparés au stock de " + esc(nomGh()) + " seul.</p>" : "")
    + '<div class="qualites">' + qualites + "</div>"
    + '<div class="deux">' + colonne(true) + colonne(false) + "</div>";
}

// Le boss a gauche (nom, qualite, lieu dans la couleur de son ecosysteme),
// ses MP a droite : le type, le stock du hall et ce qu'il manque.
function ligneMob(x) {
  const b = x.b;
  const mps = x.mps.sort((m, n) => typeFr(m.mp.split("_")[3]).localeCompare(typeFr(n.mp.split("_")[3])))
    .map((m) => '<div class="butin" title="' + esc(m.nom || m.mp) + '"><b>'
      + esc(typeFr(m.mp.split("_")[3])) + '</b><span class="faible">stock ' + nombre(m.stock)
      + (tropBas(b, m) ? " · Q" + b.q + ", recettes en Q" + m.qmin + "+"
         : m.manque > 0 ? " · manque " + nombre(m.manque) : "")
      + (m.statut === "stop" ? " · en trop " + nombre(enTrop(m)) : "") + "</span></div>").join("")
    || butinLibre(b).sort((m, n) => typeFr(m.mp.split("_")[3]).localeCompare(typeFr(n.mp.split("_")[3])))
      .map((m) => '<div class="butin" title="Aucune recette ne la demande"><b>'
        + esc(typeFr(m.mp.split("_")[3])) + '</b><span class="faible">stock ' + nombre(m.stock)
        + "</span></div>").join("")
    || '<span class="faible">Aucune MP connue</span>';
  return '<tr><td><b class="nom-mob">' + esc(b.nom) + '</b><span class="qmob">Q' + b.q + "</span>"
    + '<div class="faible">' + esc(b.espece) + " · " + enCouleur(b.eco, esc(ECOS[b.eco])) + "</div>"
    + (b.lieu ? b.lieu.split(" · ").map((l) => '<div class="faible">' + esc(l) + "</div>").join("")
       : '<div class="faible"><i>lieu non relevé</i></div>') + "</td><td>" + mps + "</td></tr>";
}

function vueRecettes() {
  // A forer d'abord, puis bientot en rupture, puis suffisant
  const ORDRE = { forer: 0, rupture: 1, ok: 2 };
  // Sans la composition (recette d'un autre, pour qui n'est pas Xiom) : ni
  // depliage, et le filtre et la recherche ne voient que le nom et la MP
  // qui bloque.
  const mpsDe = (x) => x.besoins ? x.besoins.map((b) => b.mp) : x.bloque ? [x.bloque] : [];
  const liste = calcul.recettes.filter((x) =>
    (!eco || mpsDe(x).some((mp) => mp.split("_")[1] === eco))
    && retenue(x.r.nom + " " + mpsDe(x).map((mp) => ((noms.mp[mp] || {}).nom || "")
                                    + " " + mp.replace(/_/g, " ")).join(" ")))
    .sort((a, b) => ORDRE[a.statut] - ORDRE[b.statut] || a.possibles - b.possibles
                    || a.r.nom.localeCompare(b.r.nom));
  const lignes = liste.map((x) => {
    const depliable = Boolean(x.besoins);
    const ouverte = depliable && ouvertes.has(x.r.id);
    let html = "<tr" + (depliable ? ' class="recette' + (ouverte ? " ouverte" : "") + '" data-id="'
      + esc(x.r.id) + '"' : "") + "><td>" + esc(x.r.nom) + '<div class="faible">'
      + esc(noms.plans[x.r.plan] || "Plan " + x.r.plan) + "</div></td>"
      + "<td>" + badge(x.statut) + "</td>"
      + '<td class="n"><b>' + nombre(x.possibles) + "</b> / " + x.objectif + "</td>"
      + "<td>" + (x.statut === "ok" ? "" : nomMp(x.bloque)) + "</td></tr>";
    if (ouverte) html += '<tr class="detail"><td colspan="4">' + detail(x) + "</td></tr>";
    return html;
  }).join("");
  return '<div class="cadre"><table><thead><tr><th>Recette</th><th>État</th>'
    + '<th class="n">Crafts possibles</th><th>MP qui bloque</th></tr></thead><tbody>'
    + lignes + "</tbody></table></div>";
}

function detail(x) {
  // Un joueur regle ses propres recettes.
  const connecte = Boolean(etat.editeur || (x.r.auteur && x.r.auteur === etat.qui));
  const reg = etat.reglages;
  const qc = x.r.qualite ?? reg.qualite;
  const lignes = x.besoins.map((b) => {
    const propre = (x.r.minimums || {})[b.mp];
    const q = connecte
      ? '<input type="number" min="1" max="300" data-min="' + esc(b.mp) + '" value="'
        + (propre || "") + '" placeholder="' + qc + '">'
      : "Q" + b.min + (propre ? " *" : "");
    return "<tr><td>" + nomMp(b.mp) + '</td><td class="n">' + b.n + "</td><td>" + q
      + '</td><td class="n">' + nombre(b.utile) + '</td><td class="n">'
      + nombre(b.crafts) + "</td></tr>";
  }).join("");
  let html = "<table><thead><tr><th>MP</th><th class=\"n\">Par craft</th>"
    + "<th>Qualité mini</th><th class=\"n\">Stock</th><th class=\"n\">Crafts</th>"
    + "</tr></thead><tbody>" + lignes + "</tbody></table>";
  if (!connecte) {
    return html + (Object.keys(x.r.minimums || {}).length
      ? '<p class="faible">* qualité relevée pour cette MP dans cette recette.</p>' : "");
  }
  return html + '<div class="edition" data-edition="' + esc(x.r.id) + '">'
    + '<label>Objectif <input type="number" min="0" max="100000" data-champ="objectif" value="'
    + (x.r.objectif ?? "") + '" placeholder="' + reg.objectif + '"></label>'
    + '<label>Qualité de craft <input type="number" min="1" max="300" data-champ="qualite" value="'
    + (x.r.qualite ?? "") + '" placeholder="' + reg.qualite + '"></label>'
    + '<button type="button" class="principal" data-action="enregistrer">Enregistrer</button>'
    + '<button type="button" class="danger" data-action="supprimer">Supprimer la recette</button>'
    + '<span>Case vide : réglage commun.</span></div>';
}

// ------------------------------------------------------------ recettes .kc

// Meme regle que outils/page-mp.py : la recette importee ici et la meme
// lue par l'outil doivent tomber sur le meme identifiant.
function identifiant(nom) {
  const plat = nom.replace(/Œ/g, "Oe").replace(/œ/g, "oe").normalize("NFD")
    .replace(/[^\x00-\x7f]/g, "").toLowerCase();
  return plat.replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "recette";
}

function lireKc(nomFichier, texte) {
  texte = texte.replace(/\r\n/g, "\n");
  const plan = /^PatternID=(\d+)/m.exec(texte);
  const pieces = [...texte.matchAll(/^slot(\d+)=(\d+)x\s+(\S+)/gm)]
    .map((m) => ({ n: Number(m[2]), mp: m[3] }));
  if (!plan || !pieces.length) return null;
  const nom = nomFichier.replace(/\.kc$/i, "").slice(0, 80);
  return { id: identifiant(nom), nom, plan: Number(plan[1]), pieces, minimums: {} };
}

let aImporter = [];

function brancherReglages() {
  $("#r-enregistrer").addEventListener("click", async () => {
    const r = { guilde: etat.reglages.guilde };
    for (const cle of ["objectif", "qualite", "stop", "rupture", "nexus_voulu", "nexus_rupture"]) {
      r[cle] = Number($("#r-" + cle).value);
    }
    if (await envoyer({ action: "reglages", reglages: r })) bandeau("Réglages enregistrés");
  });
  brancherImport();
}

function brancherImport() {
  $("#fichiers").addEventListener("change", async (ev) => {
    aImporter = [];
    const lignes = [];
    for (const f of ev.target.files) {
      // KipeeCraft ecrit en Windows-1252 : un accent lu en UTF-8 serait casse.
      const texte = new TextDecoder("windows-1252").decode(await f.arrayBuffer());
      const r = lireKc(f.name, texte);
      if (!r) { lignes.push("<li class=\"inconnue\">" + esc(f.name) + " : pas de recette</li>"); continue; }
      // La recette d'un autre, sans sa composition : le serveur garde
      // lui-meme ses reglages propres.
      const existe = (etat.recettes || []).find((e) => e.id === r.id)
        || (etat.resumes || []).map((x) => x.r).find((e) => e.id === r.id);
      if (existe) {
        // On garde ce qui a ete regle sur le site pour cette recette.
        for (const cle of ["objectif", "qualite"]) if (existe[cle] != null) r[cle] = existe[cle];
        for (const [mp, q] of Object.entries(existe.minimums || {})) {
          if (r.pieces.some((p) => p.mp === mp)) r.minimums[mp] = q;
        }
      }
      const inconnues = r.pieces.filter((p) => !noms.mp[p.mp]).map((p) => p.mp);
      aImporter.push(r);
      lignes.push("<li>" + esc(r.nom) + ' <span class="faible">(' + (existe ? "remplace" : "nouvelle")
        + ", " + r.pieces.length + " pièces)</span>"
        + (inconnues.length ? ' <span class="inconnue">MP inconnues : ' + esc(inconnues.join(", ")) + "</span>" : "")
        + "</li>");
    }
    $("#apercu").innerHTML = lignes.join("");
    $("#importer").hidden = !aImporter.length;
    $("#importer").textContent = "Importer " + aImporter.length + " recette" + (aImporter.length > 1 ? "s" : "");
  });
  $("#importer").addEventListener("click", async () => {
    let faites = 0;
    for (const r of aImporter) {
      if (!(await envoyer({ action: "recette", recette: r }, false))) break;
      faites++;
    }
    aImporter = [];
    await relire();
    bandeau(faites + " recette" + (faites > 1 ? "s" : "") + " importée" + (faites > 1 ? "s" : ""));
  });
}

// ------------------------------------------------------------ ecriture

async function envoyer(corps, relireApres = true) {
  try {
    const r = await fetch("mp.php", { method: "POST", cache: "no-store",
      headers: { "Content-Type": "application/json", "X-MP": jeton },
      body: JSON.stringify(corps) });
    const reponse = await r.json().catch(() => ({}));
    if (r.status === 401) { verrouiller(); bandeau("Connexion expirée : reconnecte-toi", true); return false; }
    if (!r.ok) { bandeau("Refusé : " + (reponse.erreur || r.status), true); return false; }
  } catch (souci) {
    bandeau("Envoi impossible : " + souci.message, true);
    return false;
  }
  if (relireApres) await relire();
  return true;
}

async function relire() {
  etat = await lireEtat();
  afficherConnexion();
  recalculer();
}

function recetteEditee(id) {
  const zone = document.querySelector('[data-edition="' + CSS.escape(id) + '"]');
  const r = structuredClone(etat.recettes.find((e) => e.id === id));
  for (const cle of ["objectif", "qualite"]) {
    const v = zone.querySelector('[data-champ="' + cle + '"]').value.trim();
    if (v === "") delete r[cle]; else r[cle] = Number(v);
  }
  r.minimums = {};
  zone.parentElement.querySelectorAll("[data-min]").forEach((i) => {
    if (i.value.trim() !== "") r.minimums[i.dataset.min] = Number(i.value);
  });
  return r;
}

function afficherConnexion() {
  // Reglages : aux editeurs seulement (Ludo, Luz, Nizyros). Recettes : a
  // tous, chaque joueur n'y voyant que les siennes.
  const editeur = Boolean(etat && etat.editeur);
  $("#connecte").textContent = etat && etat.qui ? "Connecté : " + etat.qui + " " : "";
  // Annuler la porte ne doit pas laisser la page sans moyen d'y revenir.
  $("#entrer").hidden = Boolean(etat);
  $("#entrer").textContent = "Se connecter";
  $("#sortir").hidden = !jeton;
  $("#onglet-reglages").hidden = !editeur;
  $("#onglet-recettes").hidden = !etat;
  if ((!editeur && onglet === "reglages") || (!etat && onglet === "recettes")) onglet = "forer";
  majChoixGh();
}

  document.querySelectorAll(".menu").forEach((m) => {

    m.querySelector(".menu-liste").hidden = true;
    m.querySelector(".menu-titre").setAttribute("aria-expanded", "false");

}

    const m = t.closest(".menu"), liste = m.querySelector(".menu-liste");

    liste.hidden = !liste.hidden;
    t.setAttribute("aria-expanded", String(!liste.hidden));

$("#vue").addEventListener("click", async (ev) => {
  const q = ev.target.closest("[data-qmob]");
  if (q) { qualiteMob = Number(q.dataset.qmob); afficher(); return; }
  const copier = ev.target.closest("[data-copier]");
  if (copier) {
    const rois = copier.dataset.copier === "rois";
    const noms = nomsALooter(rois);
    if (!noms.length) { bandeau(rois ? "Aucun roi à looter" : "Aucun nommé à looter"); return; }
    try {
      await navigator.clipboard.writeText(noms.join("\n"));
      bandeau(noms.length + " nom" + (noms.length > 1 ? "s" : "") + " copié" + (noms.length > 1 ? "s" : ""));
    } catch (e) { bandeau("Copie impossible : " + e.message, true); }
    return;
  }
  const bouton = ev.target.closest("[data-action]");
  if (bouton) {
    const id = bouton.closest("[data-edition]").dataset.edition;
    if (bouton.dataset.action === "enregistrer") {
      if (await envoyer({ action: "recette", recette: recetteEditee(id) })) bandeau("Recette enregistrée");
    } else if (confirm("Supprimer cette recette du site ?")) {
      if (await envoyer({ action: "supprimer", id })) { ouvertes.delete(id); bandeau("Recette supprimée"); }
    }
    return;
  }
  const ligne = ev.target.closest("tr.recette");
  if (ligne) {
    const id = ligne.dataset.id;
    if (ouvertes.has(id)) ouvertes.delete(id); else ouvertes.add(id);
    afficher();
  }
});

  if (!/^g[a-z0-9]{40}$/i.test(cle)) {
    $("#ajout-message").textContent = "Ce n'est pas une clé de guilde : 41 lettres et chiffres, commençant par « g ».";

});
