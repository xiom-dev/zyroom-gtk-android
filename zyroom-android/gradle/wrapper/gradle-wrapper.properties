distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
# L'empreinte officielle de cette distribution, publiée par Gradle à l'adresse
# ci-dessus suivie de « .sha256 ». Sans elle, le wrapper télécharge et exécute
# une archive sans jamais vérifier qu'elle est bien celle qu'on attendait —
# c'est ce que le robot de F-Droid signale sous « missing distributionSha256Sum ».
# À changer en même temps que la version de Gradle, sinon plus rien ne construit.
distributionSha256Sum=d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
