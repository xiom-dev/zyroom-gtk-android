# Numéros de version des deux variantes, en un seul endroit.
#
# `versionCode` est le seul numéro qu'Android ordonne, et celui que la
# vérification de mise à jour compare : il doit croître à CHAQUE livraison
# publiée, sinon aucun téléphone ne verra la nouvelle version.
# `versionName` n'est là que pour l'affichage.
#
# Ne pas modifier ces lignes à la main : `./livraison.sh` les fait croître, et
# c'est lui qui garde d'accord ce fichier, le nom de l'APK et le `version.json`
# publié — trois endroits qu'on ne peut pas tenir de tête.
guilde.versionCode=41
guilde.versionName=2.35
dev.versionCode=78
dev.versionName=2.43
